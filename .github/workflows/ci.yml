name: ci

# Static gates (lint/typecheck/gui) + unit tests + the detection-quality release gate,
# on every push and PR. The gate uses the
# no-JVM RE backend the product ships with (rizin + pypcode) rather than Ghidra headless: Ghidra
# takes ~1 min/case (≈48 min for the two corpus passes) which is far too slow for a push gate,
# while the native backend runs the whole gate in well under two minutes and is what offline
# users actually run. Validated locally (2026-10): native holds 0 corroborated false positives
# with full recall, identical to Ghidra on this corpus.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The static gates `make ci` runs. They were in the Makefile from the start, documented there as
  # "gates, not suggestions", and no CI job ever invoked them -- so of `make ci`'s four gates
  # (lint, typecheck, gui, test) only `test` was enforced. E501 drifted 14 -> 269 -> 739 -> 859
  # violations across two months, and four undefined names reached `main` in `except` handlers
  # (ruff F821 flags every one of them). These are seconds of runtime; they run on every push.
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint + type gates
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      - name: lint (ruff)
ruff check core tests tools
      # Two-tier (mypy.ini): strict over db/jobs/hashing/casestore, not reported for the
      # dict-passing analysis/API/report/eval layers.
      - name: typecheck (mypy)
        run: PYTHONPATH=core mypy core/lykos
      # The GUI harnesses render the page's script against a stubbed DOM. Under pytest they SKIP
      # when node is absent, and a skip is invisible in a green run -- which is why they run here
      # with node installed, where a missing harness FAILs.
      - name: gui harnesses (node)
        run: make gui

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: System dependencies
        run: |
          sudo apt-get update
          # gcc + cross toolchains + qemu-user drive the cross-arch and 32-bit ARM tests; rizin +
          # pypcode are the no-JVM RE backend the detect/eval tests exercise; afl++ provides afl-cc
          # + afl-fuzz so coverage_fuzz runs INSTRUMENTED on the native arch (no afl-qemu-trace
          # needed -- qemu-mode is cross-arch only, P3.1). --no-install-recommends keeps the image
          # lean; anything a test needs and does not find, it SKIPs (never fails).
          # Cross toolchains + qemu-user for the cross-arch ret2libc / static-recovery E2E tests
          # (riscv64/ppc64le/s390x alongside aarch64/arm); upx-ucl for the packer-unpack stage test;
          # wabt (wat2wasm) for the WebAssembly front-end test. A test whose tool is still missing
          # SKIPs rather than fails, but installing these means the new capabilities are actually
          # EXERCISED in CI instead of silently skipped.
          sudo apt-get install -y --no-install-recommends \
            gcc binutils gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            gcc-riscv64-linux-gnu gcc-powerpc64le-linux-gnu gcc-s390x-linux-gnu \
            qemu-user qemu-user-static rizin afl++ upx-ucl wabt
          python -m pip install --upgrade pip
          pip install pypcode
      - name: Unit tests
        run: PYTHONPATH=core python -m pytest tests/ -q
      # The JOINS between stages. Unit tests cover the stages; nothing covered the handoffs, and
      # every defect this harness has caught lived in one -- most recently a `limit=60` that made
      # L3 unreachable on any structured-input target while both stages' own tests stayed green.
      # The harness had no exit status and no Makefile target, so it only ever ran by hand.
      # This is the 7-case subset (~5 min); `make conformance` runs all 63 in `make release`.
      - name: conformance (smoke) — the stage-to-stage joins
        run: PYTHONPATH=core python tools/pipeline_conformance.py --smoke

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: RE backend + compilers (host + cross toolchains for per-arch scoring)
        run: |
          sudo apt-get update
          # Host gcc + the cross toolchains the per-arch ratchet uses; an arch whose compiler is
          # absent is simply skipped, so a missing package never fails the gate.
          sudo apt-get install -y --no-install-recommends gcc binutils rizin \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-riscv64-linux-gnu \
            gcc-powerpc64le-linux-gnu gcc-powerpc64-linux-gnu gcc-s390x-linux-gnu || true
          python -m pip install --upgrade pip
          pip install pypcode
      # Diagnostic only; the real enforcement is --require-backend on the gate steps, which FAILs
      # (not skips) when the native RE backend is absent so a backend-less runner cannot go green.
      - name: Report RE backend availability
        run: PYTHONPATH=core LYKOS_DECOMPILER=native python -m lykos doctor
      # Candidate stage = the raw rule/sink channel: every bad case must at least be flagged
      # (recall 1.0); the FP ceiling is loose on purpose because this channel is noisy and the
      # corroborated channel below is what filters it.
      - name: eval-gate — candidate (recall ratchet)
        run: |
          PYTHONPATH=core LYKOS_DECOMPILER=native python -m lykos eval --stage static \
            --min-state candidate --min-recall 1.0 --max-fp-rate 0.65 \
            --require-backend --min-negative 1
      # Corroborated stage = the taint-discriminated channel: the precision ratchet. 0 false
      # positives and full recall (CWE-798/321/259 are corroboration-exempt — they promote via
      # synthesize_secret, not corroboration). A reintroduced FP or a demoted real bug fails here.
      - name: eval-gate — corroborated (0 FP + full recall ratchet)
        run: |
          PYTHONPATH=core LYKOS_DECOMPILER=native python -m lykos eval --stage static \
            --min-state corroborated --min-recall 1.0 --max-fp-rate 0.0 \
            --require-backend --min-negative 1
      # Per-architecture regression ratchet: cross-compile the corpus for each installed arch and
      # fail on a new false positive or false negative vs eval/arch_baseline.json. Cross-arch
      # detection is x86-64-tuned and weak off it, so this prevents further degradation (and
      # makes an arch regression visible) rather than enforcing parity.
      - name: eval-gate — per-architecture ratchet
        run: |
          PYTHONPATH=core LYKOS_DECOMPILER=native python -m lykos eval --stage static \
            --arch all --min-state corroborated --require-backend --min-negative 1
      # Detection BENCHMARK: precision/recall/F1 over the vendored breadth corpus (10 CWE classes)
      # + LAVA-M recall, at both the candidate and corroborated channels. This is a TRACKED number,
      # NOT a gate -- it always exits 0; the point is to print the score on every push so a breadth
      # change is visible even when the 0-FP tripwire above is unmoved.
      - name: benchmark — detection score (tracked, non-gating)
        run: PYTHONPATH=core LYKOS_DECOMPILER=native python -m lykos eval --benchmark
