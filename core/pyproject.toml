[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lykos"
version = "0.0.1"
description = "Air-gapped binary vulnerability analysis platform (core)"
requires-python = ">=3.11"
dependencies = []          # data-model core is stdlib-only (zero-AI, air-gapped, lean)

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lykos = "lykos.cli:main"

[tool.setuptools.packages.find]
include = ["lykos*"]
