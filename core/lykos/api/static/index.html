<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lykos workbench</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c2230; --line: #2b3444;
    --ink: #e6edf3; --muted: #8b98a9; --faint: #5b6675;
    --accent: #4c8dff; --accent-2: #7aa2ff;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --run: #58a6ff;
    --crit: #ff6b6b; --high: #ff8f4c; --med: #d9a441; --low: #6cc79a; --info: #7d8aa0;
    --radius: 10px; --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  /* Light theme -- opt in via the header toggle (persisted), or the OS preference when the
     viewer has not chosen. GitHub-light-inspired, mirroring the GitHub-dark default above. */
  :root[data-theme="light"] {
    --bg: #ffffff; --panel: #f6f8fa; --panel-2: #eef1f5; --line: #d0d7de;
    --ink: #1f2328; --muted: #656d76; --faint: #8c959f;
    --accent: #0969da; --accent-2: #0550ae;
    --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --run: #0969da;
    --crit: #cf222e; --high: #bc4c00; --med: #9a6700; --low: #1a7f37; --info: #6e7781;
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #ffffff; --panel: #f6f8fa; --panel-2: #eef1f5; --line: #d0d7de;
      --ink: #1f2328; --muted: #656d76; --faint: #8c959f;
      --accent: #0969da; --accent-2: #0550ae;
      --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --run: #0969da;
      --crit: #cf222e; --high: #bc4c00; --med: #9a6700; --low: #1a7f37; --info: #6e7781;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { line-height: 1.5; }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h2 { font-size: 1.05rem; margin: 0; letter-spacing: .2px; }

  .app { max-width: 940px; margin: 0 auto; padding: 0 20px 80px; }
  .topbar { display: flex; align-items: center; justify-content: space-between;
    padding: 18px 2px; border-bottom: 1px solid var(--line); margin-bottom: 22px; position: sticky;
    top: 0; background: var(--bg); z-index: 5; }
  .brand { font-weight: 650; font-size: 1.15rem; letter-spacing: .3px; }
  .brand .logo { color: var(--accent); margin-right: 4px; }
  .brand .tag { color: var(--faint); font-weight: 400; font-size: .8rem; margin-left: 4px; }
  .top-right { display: flex; align-items: center; gap: 10px; }
  .hz { font-size: .74rem; padding: 3px 8px; border-radius: 20px; border: 1px solid var(--line); color: var(--muted); }
  .hz-ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .hz-bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }

  .stack { display: flex; flex-direction: column; gap: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .banner { padding: 10px 14px; border-radius: 8px; font-size: .9rem; }
  .banner.err { background: color-mix(in srgb, var(--bad) 15%, var(--panel)); border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent); color: #ffd7d3; }
  .center { text-align: center; padding: 14px; color: var(--muted); }

  /* Drop zone */
  .dropzone { display: block; border: 2px dashed var(--line); border-radius: 14px; padding: 54px 20px;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s; background: var(--panel); }
  .dropzone:hover { border-color: var(--accent); background: var(--panel-2); }
  .dropzone.busy { opacity: .6; pointer-events: none; }
  .dz-icon { font-size: 2.4rem; color: var(--accent); }
  .dz-title { font-size: 1.15rem; font-weight: 600; margin-top: 8px; }
  .dz-sub { color: var(--muted); font-size: .9rem; margin-top: 4px; }

  /* Target summary + CTA */
  .run-panel { display: flex; flex-direction: column; gap: 16px; }
  .summary .sum-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sum-name { font-weight: 650; font-size: 1.05rem; word-break: break-all; }
  .sum-ix { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
    border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); font-size: .74rem;
    color: var(--accent-2); margin-right: 8px; vertical-align: middle; }
  .dropzone.compact { padding: 20px; border-width: 1px; }
  .dropzone.compact .dz-icon { font-size: 1.4rem; }
  .dropzone.compact .dz-title { font-size: .95rem; }
  .sum-hash { color: var(--faint); font-family: var(--mono); font-size: .78rem; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
  .fact { display: flex; flex-direction: column; }
  .fk { font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); }
  .fv { font-size: .9rem; }
  .headline { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--accent-2); font-size: .95rem; }
  .sum-head { align-items: flex-start; }
  .mits { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 55%; }
  .mit { font-size: .68rem; padding: 2px 7px; border-radius: 5px; font-family: var(--mono); white-space: nowrap; border: 1px solid var(--line); }
  .mit-good { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .mit-weak { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .dang { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .dang-lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; color: var(--warn); margin-right: 4px; }
  .dang-sym { font-family: var(--mono); font-size: .78rem; color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: 5px; padding: 1px 6px; }
  .hashes { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; }
  .hash-row { display: flex; gap: 10px; font-size: .74rem; }
  .hash-row .hk { flex: 0 0 56px; color: var(--faint); text-transform: uppercase; letter-spacing: .5px; }
  .hash-row .hv { font-family: var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; }

  .cta { text-align: center; padding: 6px 0 2px; }
  .cta-sub { color: var(--muted); font-size: .85rem; margin-top: 8px; }
  .bg-status { margin-bottom: 8px; }
  /* Autopilot pipeline plan: done / running / remaining at a glance */
  .plan { padding: 12px 14px; margin-bottom: 12px; text-align: left; }
  .plan-head { display: flex; justify-content: space-between; align-items: center; font-size: .82rem;
    color: var(--muted); margin-bottom: 8px; }
  .plan-head .mono { color: var(--ink); font-family: var(--mono); }
  .plan-count { font-variant-numeric: tabular-nums; color: var(--accent-2); font-weight: 600; }
  .plan-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .plan-step { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 6px;
    font-size: .9rem; color: var(--faint); }
  .plan-step .plan-ico { width: 1.1em; text-align: center; flex: none; }
  .plan-step .plan-lbl { flex: 1; }
  .plan-step .plan-detail { color: var(--muted); font-size: .8rem; }
  .plan-step.step-pending { color: var(--faint); }
  .plan-step.step-running { color: var(--ink); background: color-mix(in srgb, var(--run) 12%, transparent); }
  .plan-step.step-running .plan-lbl { font-weight: 600; }
  .plan-step.step-done { color: var(--ink); }
  .plan-step.step-done .plan-ico { color: var(--ok); }
  .plan-step.step-skipped { color: var(--faint); }
  .plan-step.step-error { color: var(--bad); }
  .plan-step.step-error .plan-ico { color: var(--bad); }
  .plan-step.step-cancelled { color: var(--warn); }

  /* Compact pipeline summary (progress bar + current step + dot strip; NOT a stage list) */
  .plan.compact { padding: 12px 16px; }
  .plan-bar { height: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .plan-fill { height: 100%; background: var(--accent); border-radius: 5px; transition: width .35s; }
  .plan-fill.err { background: var(--bad); }
  .plan-now { margin: 8px 0 6px; font-size: .86rem; min-height: 1.2em; }
  .plan-nowok { color: var(--ok); } .plan-nowerr { color: var(--bad); }
  .plan-dots { display: flex; flex-wrap: wrap; gap: 5px; }
  .plan-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); cursor: help;
    transition: background .2s, transform .2s; }
  .plan-dot.dot-done { background: var(--ok); }
  .plan-dot.dot-running { background: var(--run); transform: scale(1.35); box-shadow: 0 0 0 3px color-mix(in srgb, var(--run) 25%, transparent); }
  .plan-dot.dot-error { background: var(--bad); }
  .plan-dot.dot-skipped { background: color-mix(in srgb, var(--faint) 40%, transparent); }
  .plan-dot.dot-cancelled { background: var(--warn); }
  .plan-dot.dot-pending { background: var(--line); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink); border-radius: 8px; padding: 8px 14px;
    font-size: .88rem; cursor: pointer; font-family: inherit; }
  .btn:hover { border-color: var(--accent); text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
  .btn.big { font-size: 1.05rem; padding: 12px 28px; }
  .btn.small { padding: 5px 10px; font-size: .8rem; }
  .btn.ghost { background: transparent; }
  .theme-toggle { padding: 6px 10px; font-size: 1rem; line-height: 1; }

  /* Log */
  .log-head { font-weight: 600; margin-bottom: 10px; min-height: 20px; }
  .log-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .log-row { display: flex; align-items: baseline; gap: 9px; font-size: .88rem; }
  /* stage rows: a status icon that transitions in place */
  .st-ico { flex: 0 0 16px; width: 16px; text-align: center; font-size: .8rem; font-weight: 700; line-height: 1.4; }
  .st-ok { color: var(--ok); }
  .st-bad { color: var(--bad); }
  .st-run { flex: 0 0 16px; width: 12px; height: 12px; margin: 3px 2px 0; border: 2px solid var(--line);
    border-top-color: var(--run); border-radius: 50%; animation: rot .7s linear infinite; }
  .log-row.st-running .log-label { color: var(--run); }
  .log-row.st-running { opacity: 1; }
  .log-label { font-weight: 500; }
  .log-detail { color: var(--muted); font-size: .82rem; }
  .log-detail::before { content: "— "; color: var(--faint); }
  .log-cached { color: var(--faint); font-size: .72rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .log-progress { color: var(--run); font-size: .82rem; font-variant-numeric: tabular-nums; }
  .log-progress::before { content: "— "; color: var(--faint); }
  /* info rows: a small coloured dot */
  .log-row.info .log-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; margin: 5px 4px 0; background: var(--accent); }
  .log-row.tone-warn .log-dot { background: var(--warn); }
  .log-row.info .log-text { color: var(--muted); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* Results */
  .results-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .results-head .report-links { margin-left: auto; display: flex; gap: 6px; }
  /* Triage divider between demonstrated findings and the speculative candidate pile. */
  .triage-bar { display: flex; align-items: center; gap: 10px; margin: 10px 0 6px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .triage-toggle { font-variant-numeric: tabular-nums; }
  .triage-note { font-size: .78rem; color: var(--faint); }
  .pill { font-size: .74rem; padding: 3px 9px; border-radius: 20px; }
  .pill.good { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }

  .finding { border-left: 3px solid var(--line); }
  .finding.demo { border-left-color: var(--ok); background: color-mix(in srgb, var(--ok) 6%, var(--panel)); }
  .find-top { display: flex; align-items: flex-start; gap: 11px; }
  .find-id { flex: 1 1 auto; }
  .find-title { font-weight: 600; }
  .find-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .78rem; color: var(--muted); margin-top: 2px; }
  .find-meta .cwe { font-family: var(--mono); color: var(--accent-2); }
  /* A CWE badge carries a hover description (title=): mark it so people know to hover. */
  .cwe-info { cursor: help; text-decoration: underline dotted; text-underline-offset: 2px; }
  .ev-sub .cwe-name { color: var(--fg-dim, #9aa); font-size: 0.85em; }
  .find-gloss { color: var(--muted); font-size: .82rem; margin-top: 8px; }
  .effects { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .effects-head { font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .effect-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
    font-size: .78rem; font-weight: 600; border: 1px solid transparent; }
  .effect-badge .eff-status { font-size: .62rem; letter-spacing: .05em; text-transform: uppercase; opacity: .7; font-weight: 700; }
  .eff-demo { background: color-mix(in srgb, var(--bad) 16%, transparent); border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: color-mix(in srgb, var(--bad) 88%, var(--ink)); }
  .eff-pot { background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 35%, transparent); color: color-mix(in srgb, var(--warn) 85%, var(--ink)); }
  .effect-proofs { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .effect-proofs li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .82rem; }
  .ep-k { font-weight: 600; color: color-mix(in srgb, var(--bad) 85%, var(--ink)); }
  .ep-note { color: var(--muted); }
  .btn.xsmall { font-size: .7rem; padding: 2px 8px; }
  .sev { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center;
    justify-content: center; font-size: .72rem; font-weight: 700; color: #0d1117; flex: 0 0 auto; }
  .sev-critical { background: var(--crit); } .sev-high { background: var(--high); }
  .sev-medium { background: var(--med); } .sev-low { background: var(--low); } .sev-info { background: var(--info); }
  .badge { font-size: .72rem; padding: 3px 9px; border-radius: 20px; white-space: nowrap; border: 1px solid var(--line); }
  .badge.state-poc-backed { background: var(--ok); color: #0d1117; border-color: var(--ok); font-weight: 700; }
  .badge.state-confirmed { background: color-mix(in srgb, var(--ok) 25%, transparent); color: var(--ok); }
  .badge.state-corroborated { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
  .badge.state-candidate { color: var(--muted); }

  .find-meta .at code { font-family: var(--mono); color: var(--accent-2); }
  .exploit-rating { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-top: 12px;
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); }
  .exploit-rating.exp-hi { background: color-mix(in srgb, var(--bad) 12%, transparent); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  .exploit-rating.exp-mid { background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
  .exploit-rating.exp-lo { background: var(--panel-2); }
  .er-badge { font-weight: 700; font-size: .78rem; letter-spacing: .3px; }
  .exp-hi .er-badge { color: var(--bad); } .exp-mid .er-badge { color: var(--warn); } .exp-lo .er-badge { color: var(--muted); }
  .er-why { font-size: .84rem; color: var(--ink); }
  .exploit { margin-top: 12px; background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
  .exploit-head { font-size: .74rem; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); margin-bottom: 6px; }
  .exploit-trail { margin: 0; padding-left: 18px; font-size: .85rem; display: flex; flex-direction: column; gap: 5px; }
  .exploit-trail li { line-height: 1.5; }
  .et-k { display: inline-block; font-size: .68rem; text-transform: uppercase; letter-spacing: .4px; color: var(--accent-2);
    background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 4px; padding: 0 6px; margin-right: 6px; }
  .nextsteps { margin-top: 12px; background: color-mix(in srgb, var(--accent) 7%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 8px; padding: 10px 12px; }
  .nextsteps .steps-head { font-size: .74rem; text-transform: uppercase; letter-spacing: .5px; color: var(--accent-2); margin-bottom: 4px; }
  .nextsteps ul { margin: 0; padding-left: 18px; font-size: .85rem; display: flex; flex-direction: column; gap: 4px; }
  .verify { font-size: .74rem; padding: 2px 8px; border-radius: 5px; font-weight: 600; white-space: nowrap; }
  .verify-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); }
  .verify-flaky { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
  .poc-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .poc-level { font-family: var(--mono); font-size: .76rem; color: var(--accent-2); }
  .poc-sig { font-family: var(--mono); font-size: .76rem; color: var(--warn); }
  .empty { color: var(--muted); font-size: .9rem; }

  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
    align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow: auto; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    width: 100%; max-width: 860px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .modal.code { padding: 0; }
  .code-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .code-name { font-weight: 650; font-size: 1.05rem; }
  .code-addr { font-family: var(--mono); color: var(--faint); font-size: .85rem; font-weight: 400; }
  .code-sig { display: block; margin-top: 4px; font-family: var(--mono); font-size: .8rem; color: var(--muted); }
  .frame { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .frame-lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; color: var(--warn); margin-right: 4px; }
  .frame-buf { font-family: var(--mono); font-size: .78rem; color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: 5px; padding: 1px 6px; }
  .code-body { padding: 14px 18px; }
  .code-note { color: var(--muted); font-size: .8rem; margin-bottom: 8px; }
  .code-pre { margin: 0; font-family: var(--mono); font-size: .8rem; line-height: 1.55; overflow-x: auto;
    background: var(--panel-2); border-radius: 8px; padding: 12px; max-height: 52vh; overflow-y: auto; white-space: pre; }
  .code-pre.asm { white-space: normal; }
  .code-pre.src { color: #cfe3ff; }
  .src-badge { font-size: .66rem; font-weight: 600; color: var(--accent-2); background: color-mix(in srgb, var(--accent) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 5px; padding: 1px 6px; vertical-align: middle; }
  .asm-line { white-space: pre; padding: 0 4px; border-radius: 3px; }
  .asm-a { color: var(--faint); display: inline-block; min-width: 84px; }
  .asm-hit { background: color-mix(in srgb, var(--bad) 22%, transparent); }
  .asm-tag { color: var(--bad); font-weight: 700; }
  /* Ego call graph (CallGraphMini): callers -> this function -> callees, click to re-center. */
  .callgraph { padding: 12px 18px 4px; border-top: 1px solid var(--line); }
  .cg-lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); margin-bottom: 6px; }
  .cg-hint { text-transform: none; letter-spacing: 0; color: var(--faint); margin-left: 8px; font-size: .68rem; }
  .cg-svg { width: 100%; height: auto; max-height: 240px; display: block; }
  .cg-edge { stroke: var(--line); stroke-width: 1.4; }
  .cg-node rect { fill: var(--panel-2); stroke: var(--line); stroke-width: 1; }
  .cg-node text { font-family: var(--mono); font-size: 11px; fill: var(--accent-2); }
  .cg-caller, .cg-callee { cursor: pointer; }
  .cg-caller:hover rect, .cg-callee:hover rect { stroke: var(--accent); fill: var(--panel); }
  .cg-center rect { fill: var(--accent); stroke: var(--accent); }
  .cg-center text { fill: #fff; font-weight: 700; }
  .cg-more { font-family: var(--mono); font-size: 10px; fill: var(--faint); }
  .xrefs { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .xref { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
  .xref-k { font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); flex: 0 0 70px; }
  .xref-n { font-family: var(--mono); font-size: .78rem; color: var(--accent-2); background: var(--panel-2); border-radius: 5px; padding: 1px 6px; }
  button.xref-n.nav { border: 1px solid var(--line); cursor: pointer; }
  button.xref-n.nav:hover { border-color: var(--accent); color: #fff; background: var(--accent); }
  .xref-hint { color: var(--faint); font-size: .74rem; margin-top: 8px; }
  /* Evidence inspector: click any evidence to go deeper */
  .clk { cursor: pointer; }
  .exploit-trail.clk li { cursor: pointer; border-radius: 6px; transition: background .1s; }
  .exploit-trail.clk li:hover { background: var(--panel-2); }
  .exploit-rating.clk:hover { border-color: var(--accent); }
  .ev-hint { color: var(--faint); font-size: .74rem; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .modal.evidence { padding: 0; max-width: 760px; width: 92%; max-height: 86vh; overflow: auto; }
  .ev-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  .ev-title { font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .ev-sub { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: .82rem; }
  .ev-sec { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .ev-sec-h { font-size: .74rem; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); margin-bottom: 8px; }
  .ev-count { color: var(--accent-2); }
  .ev-trail { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .ev-trail li { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: baseline; font-size: .88rem; }
  .ev-trail li.ev-focus { background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 6px; padding: 4px 6px; }
  .ev-ch { color: var(--faint); font-size: .72rem; text-transform: uppercase; letter-spacing: .4px; }
  .ev-detail { color: var(--ink); word-break: break-word; }
  .ev-effects { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .ev-effects li { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); }
  .ev-effects li.eff-demo { border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 8%, transparent); }
  .ev-eff-t { font-weight: 600; }
  .ev-eff-note { color: var(--muted); font-size: .82rem; margin: 4px 0; }
  .ev-artifacts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ev-raw { margin: 0; padding: 14px 18px; background: var(--panel-2); font-family: var(--mono); font-size: .76rem;
    color: var(--muted); overflow: auto; max-height: 40vh; white-space: pre-wrap; word-break: break-word; }
  .btn.xsmall { font-size: .72rem; padding: 2px 7px; }
  .code-crumbs { margin-top: 6px; font-family: var(--mono); font-size: .74rem; color: var(--muted); }
  .code-crumbs .cb { color: var(--accent-2); }
  .code-crumbs .cb-sep { color: var(--faint); margin: 0 5px; }
  .xrefs.xbin { border-top: none; padding-top: 0; }
  .xbin-k { color: var(--accent-2); }
  button.xbin-n { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  button.xbin-n:hover { background: var(--accent-2); color: #fff; }

  .unavail { border: 1px dashed var(--line); background: transparent; }
  .unavail-head { font-weight: 600; font-size: .9rem; }
  .unavail-sub { color: var(--muted); font-size: .82rem; margin: 2px 0 10px; }
  .unavail-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .unavail-list li { display: flex; gap: 12px; font-size: .84rem; align-items: baseline; }
  .unavail-name { flex: 0 0 130px; color: var(--faint); }
  .unavail-why { color: var(--muted); }

  .recent { margin-top: 16px; }
  .recent-head { font-size: .74rem; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); margin-bottom: 8px; }
  .recent-row { display: flex; width: 100%; align-items: baseline; justify-content: space-between;
    gap: 12px; background: transparent; border: none; border-top: 1px solid var(--line);
    padding: 9px 2px; color: var(--ink); cursor: pointer; font: inherit; text-align: left; }
  .recent-row:first-of-type { border-top: none; }
  .recent-row:hover { color: var(--accent-2); }
  .recent-name { font-size: .9rem; }
  .recent-when { font-size: .78rem; color: var(--faint); white-space: nowrap; }

  .sysmap-head { font-weight: 600; font-size: .95rem; }
  .sysmap-sub { color: var(--muted); font-size: .82rem; margin: 4px 0 12px; }
  .sysmap-edges { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .sysmap-edges li { display: flex; align-items: baseline; gap: 10px; font-size: .88rem; }
  .sm-node { font-family: var(--mono); font-size: .82rem; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 8px; }
  .sm-arrow { color: var(--accent-2); }
  .sm-sym { color: var(--warn); font-family: var(--mono); font-size: .8rem; }

  .cov-head { font-weight: 600; font-size: .95rem; }
  .cov-sub { color: var(--muted); font-size: .82rem; margin: 4px 0 12px; }
  .cov-row { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  .cov-name { flex: 0 0 130px; font-family: var(--mono); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cov-bar { flex: 1 1 auto; height: 8px; background: var(--panel-2); border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
  .cov-fill { height: 100%; border-radius: 5px; transition: width .3s; }
  .cov-hi { background: var(--ok); } .cov-mid { background: var(--warn); } .cov-lo { background: var(--bad); }
  .cov-val { flex: 0 0 auto; font-size: .82rem; font-weight: 600; min-width: 44px; text-align: right; }
  .cov-detail { color: var(--faint); font-weight: 400; font-size: .74rem; }
  .cov-row.clk { cursor: pointer; border-radius: 6px; padding: 4px 6px; margin: 4px -6px; transition: background .12s; }
  .cov-row.clk:hover { background: var(--panel-2); }
  .cov-row.clk:hover .cov-name { color: var(--accent-2); }

  /* Disassembly drill-in button on a target summary */
  .disasm-drill { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 12px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px;
    color: var(--ink); font: inherit; cursor: pointer; text-align: left; transition: border-color .12s, background .12s; }
  .disasm-drill:hover { border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .disasm-drill .dd-ico { font-family: var(--mono); color: var(--accent-2); font-weight: 700; }
  .disasm-drill .dd-lbl { font-weight: 600; font-size: .9rem; }
  .disasm-drill .dd-n { color: var(--muted); font-size: .82rem; }
  .disasm-drill .dd-go { margin-left: auto; color: var(--accent-2); font-size: .8rem; }

  /* Function browser modal */
  .modal.funcs { padding: 0; max-width: 720px; width: 92%; max-height: 86vh; display: flex; flex-direction: column; }
  .fn-head { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .fn-title { font-size: 1.02rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .fn-title .mono { font-family: var(--mono); font-size: .9rem; color: var(--muted); font-weight: 400; }
  .fn-count { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 1px 9px; font-size: .76rem; color: var(--accent-2); font-weight: 600; }
  .fn-search { margin: 12px 18px 6px; padding: 8px 11px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; color: var(--ink); font: inherit; font-size: .86rem; }
  .fn-search:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .fn-loading { padding: 28px 18px; }
  .fn-list { list-style: none; margin: 0; padding: 4px 8px 10px; overflow: auto; }
  .fn-row { display: flex; align-items: baseline; gap: 12px; padding: 7px 10px; border-radius: 7px;
    cursor: pointer; transition: background .1s; }
  .fn-row:hover { background: var(--panel-2); }
  .fn-row:hover .fn-name { color: var(--accent-2); }
  .fn-row.fn-thin { opacity: .55; }
  .fn-name { flex: 1 1 auto; font-family: var(--mono); font-size: .84rem; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .fn-addr { flex: 0 0 auto; font-size: .78rem; color: var(--faint); }
  .fn-meta { flex: 0 0 auto; font-size: .74rem; color: var(--muted); min-width: 84px; text-align: right; }
  .fn-more { padding: 8px 18px 14px; color: var(--faint); font-size: .78rem; }

  /* Live console: actual tool commands + I/O */
  .card.console { padding: 0; overflow: hidden; }
  .console-head { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent;
    border: none; border-bottom: 1px solid var(--line); padding: 12px 16px; cursor: pointer;
    color: var(--ink); font: inherit; text-align: left; }
  .console-title { font-weight: 600; font-size: .95rem; }
  .console-sub { color: var(--muted); font-size: .8rem; }
  .console-count { margin-left: auto; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 1px 9px; font-size: .74rem; color: var(--accent-2); font-weight: 600; }
  .console-toggle { color: var(--faint); }
  .console-body { max-height: 340px; overflow-y: auto; background: #0b0e14; padding: 8px 0;
    font-family: var(--mono); font-size: .76rem; line-height: 1.5; }
  :root:not([data-theme="dark"]) .console-body { background: #0b0e14; }
  .con-line { padding: 2px 14px; border-left: 2px solid transparent; }
  .con-line.con-ok { border-left-color: color-mix(in srgb, var(--ok) 55%, transparent); }
  .con-line.con-bad { border-left-color: var(--bad); }
  .con-line.con-kill { border-left-color: var(--warn); }
  .con-cmd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; color: #c8d3e0; }
  .con-prompt { color: var(--accent-2); font-weight: 700; }
  .con-text { word-break: break-all; }
  .con-meta { margin-left: auto; display: inline-flex; gap: 8px; align-items: baseline; white-space: nowrap; }
  .con-rc { color: #7fbf7f; font-size: .72rem; } .con-line.con-bad .con-rc { color: #e06c75; }
  .con-note { color: var(--warn); font-size: .72rem; }
  .con-ms { color: #5c6773; font-size: .72rem; }
  .con-out { margin: 2px 0 4px 14px; padding: 4px 8px; background: #10141c; border-radius: 4px;
    color: #8f9aa8; white-space: pre-wrap; word-break: break-word; max-height: 8em; overflow: auto; }
  .con-out.con-err { color: #d0a0a0; }

  /* Live intra-stage progress under the background-run spinner */
  .bg-activity { display: flex; align-items: center; gap: 8px; margin: 6px 0 2px; font-size: .82rem; color: var(--muted); }
  .bg-activity .bg-pct { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent-2);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; }
  .bg-activity .bg-act-msg { font-family: var(--mono); font-size: .78rem; }

  /* ── Verdict-first layer ─────────────────────────────────────────────────────────────── */
  /* Per-target verdict chips (multi-binary) — the case answer at a glance; click to jump. */
  .verdict-strip { display: flex; flex-wrap: wrap; gap: 8px; }
  .verdict-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: .82rem;
    cursor: pointer; transition: border-color .12s, background .12s; }
  .verdict-chip:hover { border-color: var(--accent); }
  .vchip-name { font-family: var(--mono); font-size: .78rem; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 14ch; }
  .vchip-eff { font-weight: 600; }
  .vchip-lvl { font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
  .verdict-chip.vc-demo { border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: color-mix(in srgb, var(--bad) 12%, transparent); }
  .verdict-chip.vc-demo .vchip-lvl { color: var(--bad); }
  .verdict-chip.vc-pot { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .verdict-chip.vc-pot .vchip-lvl { color: var(--warn); }
  .verdict-chip.vc-none { color: var(--muted); }

  /* The verdict card — one per target, at the top of the case view. */
  .verdict-card { border-left: 4px solid var(--line); }
  .verdict-card:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .verdict-card.vd-demo { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 7%, var(--panel)); }
  .verdict-card.vd-pot { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 6%, var(--panel)); }
  .verdict-card.vd-none { border-left-color: var(--ok); }
  .vd-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .vd-target { font-weight: 650; font-size: 1.05rem; word-break: break-all; }
  .vd-status-pill { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    padding: 3px 10px; border-radius: 999px; white-space: nowrap; flex: 0 0 auto; }
  .vs-demonstrated { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad); }
  .vs-potential { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .vs-none { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .vd-headline { margin-top: 10px; display: flex; flex-direction: column; gap: 2px; }
  .vd-eff { font-size: 1.15rem; font-weight: 700; }
  .vd-demo .vd-eff { color: color-mix(in srgb, var(--bad) 88%, var(--ink)); }
  .vd-pot .vd-eff { color: color-mix(in srgb, var(--warn) 85%, var(--ink)); }
  .vd-eff.neutral { color: var(--ink); }
  .vd-eff-sub { color: var(--muted); font-size: .85rem; }
  /* L1 ▸ L2 ▸ L3 ladder meter: how far the exploit chain got. */
  .vd-ladder { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .vd-ladder-lbl { font-size: .68rem; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); margin-right: 4px; }
  .vd-rung { font-family: var(--mono); font-size: .74rem; font-weight: 700; padding: 3px 10px; border-radius: 6px;
    border: 1px solid var(--line); color: var(--faint); background: var(--panel-2); }
  .vd-rung.filled { color: #fff; background: var(--accent); border-color: var(--accent); }
  .vd-demo .vd-rung.filled { background: var(--bad); border-color: var(--bad); color: #fff; }
  .vd-pot .vd-rung.filled { background: var(--warn); border-color: var(--warn); color: #0d1117; }
  .vd-arrow { color: var(--faint); }
  .vd-arrow.filled { color: var(--accent); }
  .vd-demo .vd-arrow.filled { color: var(--bad); }
  .vd-pot .vd-arrow.filled { color: var(--warn); }
  .vd-ladder-cap { margin-left: 8px; font-size: .8rem; color: var(--muted); }
  .vd-proofs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

  /* Analysis drawer — the collapsible "process" (pipeline, run log, console, coverage). */
  .card.drawer { padding: 0; overflow: hidden; }
  .drawer-head { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent;
    border: none; padding: 12px 16px; cursor: pointer; color: var(--ink); font: inherit; text-align: left; }
  .drawer-title { font-weight: 600; font-size: .95rem; }
  .drawer-sub { color: var(--muted); font-size: .8rem; }
  .drawer-toggle { margin-left: auto; color: var(--faint); }
  .drawer-body { display: flex; flex-direction: column; gap: 16px; padding: 14px 16px 16px;
    border-top: 1px solid var(--line); }

  .spin { display: inline-flex; align-items: center; gap: 8px; }
  .spin .dot { width: 12px; height: 12px; border: 2px solid var(--faint); border-top-color: var(--accent);
    border-radius: 50%; animation: rot .7s linear infinite; }
  .spin-lbl { color: var(--muted); font-size: .88rem; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ── Workbench shell (C²): left rail · main (verdict + tabs) · right drawer ─────────────── */
  .app-wb { max-width: none; padding: 0; }
  .app-wb .topbar { padding: 13px 22px; margin-bottom: 0; }
  .wb { display: flex; align-items: stretch; min-height: calc(100vh - 60px); }
  .wb-rail { width: 234px; flex: 0 0 234px; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 16px 12px; gap: 16px; }
  .wb-main { flex: 1 1 0; min-width: 0; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .wb-drawer { width: 344px; flex: 0 0 344px; border-left: 1px solid var(--line); background: var(--panel);
    padding: 18px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
  .rail-sec-h { font-size: .66rem; text-transform: uppercase; letter-spacing: .12em; color: var(--faint); margin-bottom: 8px; }
  .rail-targets { display: flex; flex-direction: column; gap: 2px; }
  .rail-target { display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-radius: 8px; cursor: pointer;
    width: 100%; background: transparent; border: none; color: var(--ink); font: inherit; text-align: left; }
  .rail-target:hover { background: var(--panel-2); }
  .rail-target.active { background: var(--panel-2); }
  .rail-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .rail-dot.d-crit { background: var(--bad); } .rail-dot.d-warn { background: var(--warn); }
  .rail-dot.d-ok { background: var(--ok); } .rail-dot.d-none { background: var(--faint); }
  .rail-tname { flex: 1 1 auto; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail-tlvl { flex: 0 0 auto; font-family: var(--mono); font-size: .72rem; color: var(--muted); }
  .rail-pipe { display: flex; flex-direction: column; gap: 9px; font-size: .84rem; }
  .rail-step { display: flex; align-items: center; gap: 9px; color: var(--muted); }
  .rail-step .rs-ico { flex: 0 0 14px; text-align: center; }
  .rail-step.rs-done .rs-ico { color: var(--ok); } .rail-step.rs-run { color: var(--ink); font-weight: 600; }
  .rail-step.rs-run .rs-ico { color: var(--run); }
  .rail-run { margin-top: auto; }
  .rail-run .btn { width: 100%; justify-content: center; }

  /* compact verdict header for the shell */
  .wb-verdict { display: flex; align-items: center; gap: 18px; }
  .wb-verdict .vv-icon { width: 46px; height: 46px; flex: 0 0 auto; border-radius: 11px; display: flex;
    align-items: center; justify-content: center; }
  .wb-verdict.vd-demo .vv-icon { background: color-mix(in srgb, var(--bad) 16%, transparent); }
  .wb-verdict.vd-none .vv-icon { background: color-mix(in srgb, var(--ok) 16%, transparent); }
  .wb-verdict .vv-body { flex: 1 1 auto; min-width: 0; }
  .vv-eff { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
  .wb-verdict.vd-demo .vv-eff { color: color-mix(in srgb, var(--bad) 88%, var(--ink)); }
  .vv-sub { color: var(--muted); font-size: .86rem; margin-top: 2px; }
  .vv-right { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .vv-mini-ladder { display: flex; align-items: center; gap: 6px; }

  /* tab bar */
  .wb-tabs { display: flex; align-items: center; gap: 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .wb-tab { font-size: .9rem; color: var(--muted); padding: 10px 13px; background: transparent; border: none;
    border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; font: inherit; }
