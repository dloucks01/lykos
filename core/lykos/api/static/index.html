<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lykos Console</title>
<style>
:root{
  --bg:#0c1113;--surface:#121a1d;--surface-2:#172227;--surface-3:#1d2a30;
  --border:#25353b;--border-strong:#33474e;--text:#e7eef0;--dim:#9db0b7;--faint:#66787f;
  --accent:#e8ab4e;--teal:#46cabb;--ok:#57c88c;--warn:#e0b54f;--danger:#e4605f;--info:#5ea3e6;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="light"]{
  --bg:#eef1f1;--surface:#fff;--surface-2:#f5f7f7;--surface-3:#eaeeef;
  --border:#d3dadb;--border-strong:#bcc6c7;--text:#12191c;--dim:#4d5c61;--faint:#79888d;
  --accent:#b5771a;--teal:#0f7d74;--ok:#2f8f5f;--warn:#c08a1f;--danger:#c23434;--info:#2f74c0;
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* beats .grid/.tiles display so tab-switching hides panels */
body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:13.5px;display:grid;grid-template-rows:auto 1fr}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--sans);text-transform:uppercase;letter-spacing:.09em;font-size:10.5px;
  font-weight:700;color:var(--faint)}
button{font-family:var(--sans);cursor:pointer}
.btn{font-size:12px;font-weight:600;border-radius:6px;padding:6px 12px;border:1px solid var(--border-strong);
  background:var(--surface-2);color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1205}
.btn.sm{padding:4px 9px;font-size:11px}

/* top bar */
.top{display:flex;align-items:center;gap:16px;height:50px;padding:0 16px;background:var(--surface);
  border-bottom:1px solid var(--border);box-shadow:inset 0 2px 0 var(--accent)}
.logo{font-weight:800;letter-spacing:.03em;font-size:17px}
.logo b{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 9px;color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.spacer{flex:1}

/* body */
.body{display:grid;grid-template-columns:230px 1fr;min-height:0}
.rail{background:var(--surface);border-right:1px solid var(--border);padding:12px 10px;overflow-y:auto;
  display:flex;flex-direction:column;gap:6px}
.railhead{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 8px}
.caseitem{padding:9px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;color:var(--dim)}
.caseitem:hover{background:var(--surface-2);color:var(--text)}
.caseitem.active{background:var(--surface-2);color:var(--text);border-color:var(--border);
  box-shadow:inset 2px 0 0 var(--accent)}
.caseitem .cn{font-weight:600;font-size:13px}
.caseitem .cid{font-family:var(--mono);font-size:9.5px;color:var(--faint)}

.main{overflow-y:auto;padding:18px 22px 40px;min-height:0}
.mainhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.mainhead h1{margin:0;font-size:19px}
.mainhead .sub{color:var(--dim);font-size:12px;margin-top:2px}
.uploader{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 15px;margin-bottom:14px}
.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}

table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;text-transform:uppercase;letter-spacing:.05em;font-size:10px;color:var(--faint);
  font-weight:700;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:7px 8px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
.arch{font-family:var(--mono);font-size:10px;color:var(--teal);border:1px solid color-mix(in srgb,var(--teal) 40%,var(--border));border-radius:4px;padding:1px 6px}
.mit{font-family:var(--mono);font-size:9.5px;border-radius:4px;padding:1px 5px;margin-right:3px;border:1px solid}
.mit.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.mit.off{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.mit.partial{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.mit.unknown{color:var(--faint);border-color:var(--border)}
.pill{font-family:var(--sans);text-transform:uppercase;letter-spacing:.05em;font-size:10px;font-weight:700;
  border-radius:20px;padding:2px 9px;border:1px solid}
.pill.queued{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent)}
.pill.running{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pill.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.pill.error{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.pill.cancelled{color:var(--faint);border-color:var(--border)}

.log{font-family:var(--mono);font-size:11px;height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.logline{color:var(--dim);white-space:pre-wrap;word-break:break-word}
.logline .t{color:var(--teal)}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted var(--border);font-size:12px}
.kv span{color:var(--dim)} .kv b{font-family:var(--mono)}
.empty{color:var(--faint);font-size:13px;padding:40px;text-align:center}
.sec{font-family:var(--mono);font-size:10.5px}

/* view tabs */
.tabs{display:flex;gap:4px}
.tab{font-size:12px;font-weight:600;padding:6px 13px;border-radius:6px 6px 0 0;border:1px solid transparent;
  color:var(--dim);background:transparent}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);background:var(--surface);border-color:var(--border);border-bottom-color:var(--surface)}

/* findings board */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer}
.tile:hover{border-color:var(--border-strong)}
.tile.active{box-shadow:inset 0 0 0 1px var(--accent);border-color:var(--accent)}
.tile .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tile .l{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);
  font-weight:700;margin-top:5px}
.tile.crit .n{color:var(--danger)} .tile.high .n{color:#e07a4e}
.tile.pocb .n{color:var(--ok)} .tile.conf .n{color:var(--accent)}
.tile.med .n{color:var(--warn)} .tile.corr .n{color:var(--info)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input,.filters select{background:var(--surface-2);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:6px 9px;font-size:12px;font-family:var(--sans)}
.filters input{flex:1;min-width:150px;font-family:var(--mono);font-size:11px}
.sev{font-family:var(--sans);text-transform:uppercase;letter-spacing:.04em;font-size:9.5px;font-weight:800;
  border-radius:4px;padding:2px 7px;border:1px solid;white-space:nowrap}
.sev.critical{color:#fff;background:var(--danger);border-color:var(--danger)}
.sev.high{color:#e07a4e;border-color:color-mix(in srgb,#e07a4e 50%,transparent)}
.sev.medium{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.sev.low{color:var(--info);border-color:color-mix(in srgb,var(--info) 50%,transparent)}
.sev.info{color:var(--faint);border-color:var(--border)}
.st{font-family:var(--sans);text-transform:uppercase;letter-spacing:.04em;font-size:9.5px;font-weight:700;
  border-radius:20px;padding:2px 8px;border:1px solid;white-space:nowrap}
.st.candidate{color:var(--faint);border-color:var(--border)}
.st.corroborated{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,transparent)}
.st.confirmed{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.st\.poc-backed,.st.pocbacked{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent);
  border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.cbar{position:relative;height:6px;width:70px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.cbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--teal),var(--accent))}
.lvl{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--ok);border:1px solid
  color-mix(in srgb,var(--ok) 45%,transparent);border-radius:4px;padding:1px 5px}
.frow td{vertical-align:middle}
.frow .ttl{font-weight:600}
.frow .ev{color:var(--faint);font-size:10.5px;font-family:var(--mono)}

/* report builder */
.fld{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.statechks{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:11px;cursor:pointer;color:var(--dim)}
.chk input{accent-color:var(--accent);cursor:pointer}
.rptbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rptbtns a.btn{text-decoration:none;display:inline-flex;align-items:center}

/* system map */
.smwrap{width:100%;overflow-x:auto}
.smsvg{width:100%;height:auto;display:block}
.smedge{stroke:var(--border-strong);stroke-width:1.6}
.smarrow{fill:var(--border-strong)}
.smcount{fill:var(--faint);font-size:9px;font-family:var(--mono);text-anchor:middle}
.smtaint{stroke:var(--danger);stroke-width:2;stroke-dasharray:5 3}
.smarrowT{fill:var(--danger)}
.smtaintlbl{fill:var(--danger);font-size:9.5px;font-family:var(--mono);font-weight:700;text-anchor:middle}
.smipc{stroke:var(--info);stroke-width:1.8;stroke-dasharray:2 3}
.smarrowI{fill:var(--info)}
.smipclbl{fill:var(--info);font-size:9.5px;font-family:var(--mono);font-weight:700;text-anchor:middle}
.smnode{cursor:pointer}
.smnode rect{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.2}
.smnode:hover rect{stroke:var(--accent)}
.smname{fill:var(--text);font-size:11px;font-weight:700;text-anchor:middle;font-family:var(--mono)}
.smmeta{fill:var(--faint);font-size:9px;text-anchor:middle;font-family:var(--mono)}

/* command palette */
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--border-strong);border-radius:4px;
  padding:1px 5px;color:var(--dim);background:var(--surface-2)}
.palette{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);
  backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;z-index:50}
.palette[hidden]{display:none}
.palbox{margin-top:12vh;width:min(560px,92vw);background:var(--surface);border:1px solid var(--border-strong);
  border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--text);
  font-size:15px;padding:14px 16px;font-family:var(--sans);outline:none}
.pallist{max-height:340px;overflow-y:auto;padding:6px}
.palitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:7px;
  cursor:pointer;color:var(--dim);font-size:13px}
.palitem .hint{font-size:10px;color:var(--faint);font-family:var(--mono)}
.palitem.sel,.palitem:hover{background:var(--surface-2);color:var(--text)}
.palitem.sel{box-shadow:inset 2px 0 0 var(--accent)}
/* ---- workbench detail: analysis pipeline ---- */
.wbhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.wbtitle{font-size:12.5px;color:var(--text);font-weight:600}
.wbmits{display:flex;gap:4px;flex-wrap:wrap}
.pipe{display:flex;flex-direction:column;gap:10px}
.stage{border:1px solid var(--border);border-radius:9px;background:var(--surface-2);overflow:hidden}
.stagehdr{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--surface-3);
  border-bottom:1px solid var(--border)}
.stagehdr b{font-size:12.5px;font-weight:600}
.snum{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
  border-radius:50%;background:var(--surface);border:1px solid var(--border-strong);
  color:var(--dim);font-size:11px;font-weight:700}
.schip{margin-left:auto;font-size:11px;color:var(--faint)}
.schip.done{color:var(--ok)}.schip.run{color:var(--accent)}.schip.warn{color:var(--danger)}
.sbody{padding:11px 12px}
.kvgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}
.kvgrid .kv{border:0;padding:2px 0}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.actions .inp{flex:1;min-width:110px;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-family:var(--mono);font-size:11px}
.actions .sel{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);
  border-radius:6px;padding:5px 8px;font-size:11.5px;font-weight:600}
.vsep{width:1px;align-self:stretch;background:var(--border);margin:2px 3px}
.disc{margin-top:8px}.disc summary{cursor:pointer;font-size:11px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.disc summary::marker{color:var(--faint)}
.menu{position:relative}.menu>summary{list-style:none;display:inline-flex}
.menu>summary::-webkit-details-marker{display:none}
.menu .menubody{position:absolute;z-index:5;top:110%;left:0;display:flex;flex-direction:column;
  gap:5px;padding:7px;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:8px;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hint{color:var(--faint);font-size:11px;margin-bottom:6px}
.notewarn{margin-top:8px;color:var(--warn)}
.code{white-space:pre-wrap;max-height:200px;overflow:auto;margin-top:6px}
.lt{color:var(--faint);font-variant-numeric:tabular-nums;margin-right:2px}
.runrow{align-items:center}.runmeta{display:flex;gap:8px;align-items:center}
.runtime{color:var(--faint);font-size:10.5px}
.fsearch{width:100%;box-sizing:border-box;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-family:var(--mono);
  font-size:11px;margin:6px 0}
.frow.clk{cursor:pointer;padding:3px 4px;border-radius:5px}
.frow.clk:hover{background:var(--surface-3)}
.fcount{color:var(--faint);font-size:10px;margin-left:4px}
/* ---- findings board: inline detail ---- */
tr.frow.sel>td{background:var(--surface-3)}
tr.fdetail>td{background:var(--surface-2);border-bottom:1px solid var(--border-strong);padding:0}
.fdbody{padding:12px 14px}
.fdhead{font-size:12.5px;margin-bottom:8px}
.fdmeta{display:block;color:var(--faint);font-size:11px;margin-top:3px}
.fdkv{display:flex;gap:10px;font-size:11.5px;padding:1px 0}
.fdkv>span{color:var(--faint);min-width:66px}
.evlist{display:flex;flex-direction:column;gap:4px}
.evrow{font-size:11px;color:var(--dim);font-family:var(--mono);line-height:1.4}
.evch{display:inline-block;min-width:96px;color:var(--teal)}
/* ---- reverse-engineering code viewer ---- */
#funcs .frow.on{background:var(--surface-3);box-shadow:inset 2px 0 0 var(--accent)}
.cv{margin:8px 0 4px;border:1px solid var(--border-strong);border-radius:8px;
  background:var(--bg);overflow:hidden}
.cvhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  padding:8px 10px;background:var(--surface-3);border-bottom:1px solid var(--border)}
.cvname{font-size:12px}
.cvbody{display:grid;grid-template-columns:1fr 1fr}
.cvpane{min-width:0}
.cvpane+.cvpane{border-left:1px solid var(--border)}
.cvplabel{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
  padding:6px 12px 2px}
.cvcode{margin:0;padding:4px 12px 10px;white-space:pre-wrap;overflow:auto;max-height:320px;
  font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--text);word-break:break-word}
.cvcalls{padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:6px;
  flex-wrap:wrap;align-items:center}
.cvcalls span:not(.cvplabel):not(.hint){font-family:var(--mono);font-size:11px;padding:2px 7px;
  border-radius:5px;background:var(--surface-2);border:1px solid var(--border)}
.cvcalls span.ext{color:var(--warn);border-color:var(--warn)}
@media(max-width:920px){.cvbody{grid-template-columns:1fr}
  .cvpane+.cvpane{border-left:0;border-top:1px solid var(--border)}}
/* ---- CFG graph ---- */
.cvcfg{overflow:auto;max-height:320px;padding:6px}
.cfgsvg{display:block;font-family:var(--mono)}
.cfgnode rect{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1}
.cfgnode:hover rect{stroke:var(--accent)}
.cfghdr{fill:var(--accent);font-size:9px;font-weight:700}
.cfgins{fill:var(--dim);font-size:8.5px}
.cfgins.dim{fill:var(--faint)}
.cfgedge{fill:none;stroke:var(--border-strong);stroke-width:1.4}
.cfgedge.back{stroke:var(--info);stroke-dasharray:4 3}
.cfgarh{fill:var(--border-strong)}
/* ---- system map: toolbar + legend ---- */
.smtools{display:flex;gap:6px;flex-wrap:wrap}
.smlegend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--dim);
  padding:7px 2px 9px;border-bottom:1px solid var(--border);margin-bottom:8px}
.smlegend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:16px;height:0;border-top:2px solid var(--faint);display:inline-block}
.lgdyn{border-top-color:var(--border-strong)}
.lgtaint{border-top:2px dashed var(--danger)}
.lgipc{border-top:2px dotted var(--info)}
/* ---- report: export format grid ---- */
.fmtgrid{display:grid;grid-template-columns:1fr;gap:8px}
.fmt{display:flex;align-items:center;gap:12px}
.fmt>.btn,.fmt>a.btn{min-width:120px;justify-content:center;text-align:center}
.fmt>span{font-size:11.5px;color:var(--dim)}
@media(min-width:720px){.fmtgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="top">
  <span class="logo"><b>LYKOS</b></span>
  <span class="chip"><span class="dot"></span>air-gapped</span>
  <span class="spacer"></span>
  <button class="btn sm" id="cmdk" title="Command palette">⌘K</button>
  <button class="btn sm" id="theme">theme</button>
</div>
<div class="body">
  <aside class="rail">
    <div class="railhead"><span class="eyebrow">Cases</span>
      <span style="display:flex;gap:4px">
        <button class="btn sm" id="impcase" title="Import a case archive (.tar.gz)">Import</button>
        <button class="btn sm" id="newcase">+ New</button>
      </span></div>
    <input type="file" id="impfilerail" accept=".gz,.tgz,.tar" style="display:none">
    <div id="cases"></div>
  </aside>
  <main class="main" id="main">
    <div class="empty">Select or create a case to begin. Press <span class="kbd">⌘K</span> for commands.</div>
  </main>
</div>

<div class="palette" id="palette" hidden>
  <div class="palbox" role="dialog" aria-label="Command palette">
    <input id="palq" placeholder="Type a command…" autocomplete="off">
    <div class="pallist" id="pallist"></div>
  </div>
</div>

<script>
const api = async (path, opts={}) => {
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type")||"";
  return ct.includes("json") ? r.json() : r.text();
};
let CUR = null;      // current case id
let WS = null;
let RUNS = [];       // latest runs for the case
let POLL = null;
let DETAIL_TID = null;  // target open in the detail panel

// ---- theme ----
try{const t=localStorage.getItem("theme"); if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}
document.getElementById("theme").onclick = ()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next = cur==="light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("theme",next);}catch(e){}
};

// ---- cases ----
async function loadCases(){
  const cases = await api("/cases");
  const el = document.getElementById("cases");
  el.innerHTML = "";
  cases.forEach(c=>{
    const d=document.createElement("div");
    d.className="caseitem"+(c.id===CUR?" active":"");
    d.innerHTML=`<div class="cn">${esc(c.name)}</div><div class="cid">${c.id.slice(0,12)}</div>`;
    d.onclick=()=>selectCase(c.id, c.name);
    el.appendChild(d);
  });
}
document.getElementById("newcase").onclick = async ()=>{
  const name = prompt("Case name:", "engagement-"+new Date().toISOString().slice(0,10));
  if(!name) return;
  const c = await api("/cases",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
  await loadCases(); selectCase(c.id, c.name);
};

// ---- case view ----
async function selectCase(id, name){
  CUR=id; await loadCases();
  document.getElementById("main").innerHTML = view(name||id);
  document.getElementById("file").onchange = onUpload;
  openWS(id);
  await refresh();
  if(POLL) clearInterval(POLL);
  POLL = setInterval(refresh, 2000);
}

let BOARD_VIEW="wb", BOARD_FILTER={sev:"",state:"",q:""};
function switchView(v){
  BOARD_VIEW=v;
  const wb=document.getElementById("workbench"), bd=document.getElementById("board"),
        rp=document.getElementById("report"), sm=document.getElementById("sysmap");
  document.getElementById("tab-wb").classList.toggle("active", v==="wb");
  document.getElementById("tab-board").classList.toggle("active", v==="board");
  document.getElementById("tab-sysmap").classList.toggle("active", v==="sysmap");
  document.getElementById("tab-report").classList.toggle("active", v==="report");
  if(wb) wb.hidden = v!=="wb";
  if(bd) bd.hidden = v!=="board";
  if(sm) sm.hidden = v!=="sysmap";
  if(rp) rp.hidden = v!=="report";
  if(v==="board") loadBoard();
  if(v==="sysmap") loadSystemMap(true);
  if(v==="report") renderReport();
}

const _SEVRANK={critical:4,high:3,medium:2,low:1,info:0};
async function loadBoard(){
  const bd=document.getElementById("board"); if(!bd||!CUR) return;
  let fs=[];
  try{ fs=await api(`/cases/${CUR}/findings`); }catch(e){ fs=[]; }
  BOARD_DATA=fs;
  renderBoard();
}
let BOARD_DATA=[];
function boardCounts(fs){
  const c={total:fs.length,critical:0,high:0,medium:0,low:0,info:0,
    candidate:0,corroborated:0,confirmed:0,"poc-backed":0};
  fs.forEach(f=>{ c[f.severity]=(c[f.severity]||0)+1; c[f.state]=(c[f.state]||0)+1; });
  return c;
}
function renderBoard(){
  const bd=document.getElementById("board"); if(!bd) return;
  const all=BOARD_DATA, c=boardCounts(all);
  const f=BOARD_FILTER;
  let rows=all.filter(x=>
    (!f.sev||x.severity===f.sev) && (!f.state||x.state===f.state) &&
    (!f.q || ((x.cwe||"")+" "+(x.title||"")+" "+(x.target_name||"")+" "+(x.detector||""))
      .toLowerCase().includes(f.q.toLowerCase())));
  rows.sort((a,b)=> (_SEVRANK[b.severity]-_SEVRANK[a.severity]) ||
    ((b.confidence||0)-(a.confidence||0)));
  const tile=(cls,n,l,key,val)=>`<div class="tile ${cls} ${
    (f[key]===val)?'active':''}" onclick="boardTile('${key}','${val}')"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  const tilesHtml=`<div class="tiles">
    <div class="tile ${!f.sev&&!f.state?'active':''}" onclick="boardTile('clear','')"><div class="n">${c.total}</div><div class="l">All findings</div></div>
    ${tile('crit',c.critical,'Critical','sev','critical')}
    ${tile('high',c.high,'High','sev','high')}
    ${tile('med',c.medium,'Medium','sev','medium')}
    ${tile('corr',c.corroborated,'Corroborated','state','corroborated')}
    ${tile('conf',c.confirmed,'Confirmed','state','confirmed')}
    ${tile('pocb',c['poc-backed'],'PoC-backed','state','poc-backed')}
  </div>`;
  const filters=`<div class="filters">
    <input id="bq" placeholder="filter by CWE, title, target, detector…" value="${esc(f.q)}"
      oninput="BOARD_FILTER.q=this.value;renderBoard();document.getElementById('bq').focus()">
    <select id="bsev" onchange="BOARD_FILTER.sev=this.value;renderBoard()">
      <option value="">all severities</option>
      ${['critical','high','medium','low','info'].map(s=>`<option ${f.sev===s?'selected':''} value="${s}">${s}</option>`).join('')}
    </select>
    <select id="bstate" onchange="BOARD_FILTER.state=this.value;renderBoard()">
      <option value="">all states</option>
      ${['candidate','corroborated','confirmed','poc-backed'].map(s=>`<option ${f.state===s?'selected':''} value="${s}">${s}</option>`).join('')}
    </select>
    <span class="mono" style="color:var(--faint);font-size:11px">${rows.length} shown</span>
  </div>`;
  const body = rows.length ? `<table><thead><tr>
      <th>Sev</th><th>CWE</th><th>Finding</th><th>State</th><th>Conf</th>
      <th>Detector</th><th>Target</th><th>PoC</th></tr></thead><tbody>
    ${rows.map(x=>{
      const conf=Math.round((x.confidence||0)*100);
      const ev=(x.evidence||[]).length;
      const lvl=x.poc_level?`<span class="lvl">${esc(x.poc_level)}</span>`:'';
      const sel=x.id===SEL_FINDING;
      const row=`<tr class="frow${sel?' sel':''}" data-fid="${x.id}" onclick="toggleFindingDetail('${x.id}')">
        <td><span class="sev ${x.severity}">${esc(x.severity)}</span></td>
        <td class="mono">${esc(x.cwe||'-')}</td>
        <td><div class="ttl">${esc(x.title||'')}</div><div class="ev">${ev} evidence</div></td>
        <td><span class="st ${x.state==='poc-backed'?'pocbacked':x.state}">${esc(x.state)}</span></td>
        <td><div class="cbar" title="${conf}%"><i style="width:${conf}%"></i></div></td>
        <td class="mono" style="font-size:11px">${esc(x.detector||'-')}</td>
        <td class="mono" style="font-size:11px">${esc(x.target_name||'-')} <span class="arch">${esc(x.target_arch||'')}</span></td>
        <td>${lvl}</td></tr>`;
      return row + (sel?findingDetailRow(x):'');
    }).join('')}</tbody></table>` : `<div class="empty">No findings match. Run detection, fuzzing, or PoC stages on the Workbench.</div>`;
  bd.innerHTML = tilesHtml + filters + `<div class="card" style="padding:6px 8px">${body}</div>`;
  const q=document.getElementById('bq'); if(q && document.activeElement!==q){}
}
function boardTile(key,val){
  if(key==='clear'){ BOARD_FILTER.sev=''; BOARD_FILTER.state=''; }
  else { BOARD_FILTER[key] = (BOARD_FILTER[key]===val)?'':val; }
  renderBoard();
}
let SEL_FINDING=null;
function toggleFindingDetail(id){
  SEL_FINDING = (SEL_FINDING===id)?null:id;
  renderBoard();
  if(SEL_FINDING){ const r=document.querySelector(`tr[data-fid="${SEL_FINDING}"]`);
    if(r) r.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function findingDetailRow(x){
  const conf=Math.round((x.confidence||0)*100);
  const ev=(x.evidence||[]).map(e=>`<div class="evrow"><span class="evch">${esc(e.channel||'')}</span> ${esc(e.detail||'')}</div>`).join('')
    || '<div class="hint">No evidence recorded.</div>';
  const loc = (x.function_addr||x.site_addr)
    ? `<span class="mono">${esc(x.function_addr||'')}${x.site_addr?(' @ '+esc(x.site_addr)):''}</span>` : '—';
  return `<tr class="fdetail"><td colspan="8"><div class="fdbody">
    <div class="fdhead"><b>${esc(x.cwe||'')}</b> — ${esc(x.title||'')}
      <span class="fdmeta">${esc(x.severity)} · ${conf}% confidence · detector ${esc(x.detector||'-')} · ${esc(x.target_name||'')} <span class="arch">${esc(x.target_arch||'')}</span></span></div>
    <div class="fdkv"><span>state</span><b><span class="st ${x.state==='poc-backed'?'pocbacked':x.state}">${esc(x.state)}</span></b></div>
    <div class="fdkv"><span>location</span><b>${loc}</b></div>
    ${x.poc_level?`<div class="fdkv"><span>PoC</span><b><span class="lvl">${esc(x.poc_level)}</span> verified</b></div>`:''}
    <div class="eyebrow" style="margin:9px 0 4px">Evidence (${(x.evidence||[]).length})</div>
    <div class="evlist">${ev}</div>
    <div style="margin-top:10px"><button class="btn sm" onclick="event.stopPropagation();openFindingInWorkbench('${x.target_id}', ${JSON.stringify(x.function_addr||'')})">View in Workbench${x.function_addr?' → function':''}</button></div>
  </div></td></tr>`;
}
async function openFindingInWorkbench(tid, faddr){
  switchView('wb');
  await showDetail(tid);                         // loads triage + functions (async)
  const dc=document.getElementById('detailcard'); if(dc) dc.scrollIntoView({behavior:'smooth'});
  if(!faddr) return;
  const norm=a=>String(a||'').toLowerCase().replace(/^0x0*/,'0x');
  for(let i=0;i<25 && !FUNCS.length;i++) await new Promise(r=>setTimeout(r,80));  // await decompile load
  const fn=FUNCS.find(f=>norm(f.addr)===norm(faddr));
  if(fn) showFunc(fn.id);                        // jump straight to the vulnerable function's code
}

  const p=new URLSearchParams({format:fmt, embed: embed?"1":"0"});
  if(REPORT_FILTER.min_severity) p.set("min_severity",REPORT_FILTER.min_severity);
  if(REPORT_FILTER.states.length) p.set("states",REPORT_FILTER.states.join(","));
  return `/cases/${CUR}/report?`+p.toString();
}

let REPORT_FINDINGS=[];
async function loadReportFindings(){
  try{ REPORT_FINDINGS = await api(`/cases/${CUR}/findings`); }catch(e){ REPORT_FINDINGS=[]; }
  updateReportCount();
}
function updateReportCount(){
  const el=document.getElementById("rcount"); if(!el) return;
  const f=REPORT_FILTER, minR=f.min_severity?_SEVRANK[f.min_severity]:-1;
  const inc=REPORT_FINDINGS.filter(x=>
    (minR<0||_SEVRANK[x.severity]>=minR) && (!f.states.length||f.states.includes(x.state))).length;
  el.textContent=`${inc} of ${REPORT_FINDINGS.length} findings`;
}
function syncReportLinks(){
  const set=(id,fmt)=>{const a=document.getElementById(id); if(a) a.href=reportURL(fmt,true);};
  set('dlpdf','pdf'); set('dlsarif','sarif'); set('dljson','json');
}
function toggleState(s,on){
  const i=REPORT_FILTER.states.indexOf(s);
  if(on&&i<0) REPORT_FILTER.states.push(s); else if(!on&&i>=0) REPORT_FILTER.states.splice(i,1);
  refreshPreview();
}
function refreshPreview(){
  syncReportLinks(); updateReportCount();
  const f=document.getElementById("rpreview"); if(f) f.src=reportURL('html',false);
}
async function doImportCase(file){
  if(!file) return;
  const st=document.getElementById("impstat"); if(st) st.textContent="importing…";
  try{
    const buf=await file.arrayBuffer();
    const r=await fetch("/import",{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:buf});
    const j=await r.json();
    if(st) st.textContent = j.cases?`imported ${j.cases.length} case(s)`:(j.error||"failed");
    await loadCases();
  }catch(e){ if(st) st.textContent="import failed: "+e; }
}

// ---- system map (component graph, doc 17.1) ----
let SYSMAP={nodes:[],edges:[]};
async function loadSystemMap(resolve){
  const el=document.getElementById("sysmap"); if(!el||!CUR) return;
  el.innerHTML=`<div class="empty">Resolving component links…</div>`;
  try{ SYSMAP=await api(`/cases/${CUR}/systemmap${resolve?'?resolve=1':''}`); }
  catch(e){ SYSMAP={nodes:[],edges:[]}; }
  renderSystemMap();
}
function renderSystemMap(){
  const el=document.getElementById("sysmap"); if(!el) return;
  const nodes=SYSMAP.nodes||[], edges=SYSMAP.edges||[];
  const name={}; nodes.forEach(n=>name[n.id]=n.filename);
  const taintN=edges.filter(e=>e.kind==="taint").length;
  const ipcN=edges.filter(e=>e.kind==="ipc").length;
  const badges=[taintN?`<span style="color:var(--danger)">${taintN} cross-taint</span>`:'',
                ipcN?`<span style="color:var(--info)">${ipcN} IPC</span>`:''].filter(Boolean).join(' · ');
  const head=`<div class="cardhead" style="margin-bottom:8px">
      <span class="eyebrow">Component graph — ${nodes.length} components · ${edges.length} links${badges?' · '+badges:''}</span>
      <div class="smtools">
        <button class="btn sm" onclick="loadSystemMap(true)" title="Re-resolve import/export links across all components">↻ Resolve links</button>
        <button class="btn sm" id="ipcbtn" onclick="doModelIpc()" title="Discover IPC channels (socket/pipe/shm/mq) and pair producers with consumers">Model IPC</button>
        <button class="btn sm" id="xtaintbtn" onclick="doCrossTaint()" title="Propagate taint across resolved edges: source in A → sink in B">Cross-taint</button>
        <button class="btn sm" id="detbtn" onclick="doWholeSystem()" title="Whole-system detonation: run the components together over their real IPC and blame a crash in one on the input that entered another">Detonate</button>
      </div></div>
    <div class="smlegend">
      <span><i class="lg lgdyn"></i>dynamic link</span>
      <span><i class="lg lgtaint"></i>⚡ cross-binary taint</span>
      <span><i class="lg lgipc"></i>⇄ IPC channel</span>
      <span class="mono" style="margin-left:auto;color:var(--faint)">click a node to open it in the Workbench</span>
    </div>`;
  if(!nodes.length){ el.innerHTML=`<div class="card">${head}<div class="empty">No components yet. Upload the program and its shared libraries (or a firmware's carved parts) to this case, then re-resolve.</div></div>`; return; }
  // circular layout
  const W=760,H=Math.max(300,Math.min(520,180+nodes.length*40)),cx=W/2,cy=H/2;
  const R=nodes.length<=1?0:Math.min(H/2-60,80+nodes.length*10);
  const pos={};
  nodes.forEach((n,i)=>{ const a=-Math.PI/2+i*2*Math.PI/nodes.length;
    pos[n.id]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)}; });
  const line=edges.map(e=>{const s=pos[e.src],d=pos[e.dst]; if(!s||!d)return"";
    const taint=e.kind==="taint", isipc=e.kind==="ipc";
    // taint/ipc edges bow to opposite sides so they don't hide the dynamic-link line
    const off=taint?18:(isipc?-18:0);
    const mx=(s.x+d.x)/2+off,my=(s.y+d.y)/2; const cnt=(e.symbols||[]).length;
    let lbl="", cls="smedge", mk="url(#arrow)";
    if(taint){ lbl=`<text x="${mx}" y="${my-3}" class="smtaintlbl">⚡ ${esc(e.symbol||'taint')}</text>`;
      cls="smedge smtaint"; mk="url(#arrowT)"; }
    else if(isipc){ lbl=`<text x="${mx}" y="${my-3}" class="smipclbl">⇄ ${esc(e.symbol||'ipc')}</text>`;
      cls="smedge smipc"; mk="url(#arrowI)"; }
    else if(cnt){ lbl=`<text x="${mx}" y="${my-3}" class="smcount">${cnt} sym${cnt>1?'s':''}</text>`; }
    return `<line x1="${s.x}" y1="${s.y}" x2="${d.x}" y2="${d.y}" class="${cls}" marker-end="${mk}"/>${lbl}`;
  }).join("");
  const box=nodes.map(n=>{const p=pos[n.id];const w=150,h=46;
    return `<g class="smnode" onclick="openComponent('${n.id}')">
      <rect x="${p.x-w/2}" y="${p.y-h/2}" width="${w}" height="${h}" rx="8"/>
      <text x="${p.x}" y="${p.y-4}" class="smname">${esc((n.filename||'').slice(0,20))}</text>
      <text x="${p.x}" y="${p.y+12}" class="smmeta">${esc(n.arch||'?')} · ${n.findings||0} findings</text></g>`;
  }).join("");
  const svg=`<svg viewBox="0 0 ${W} ${H}" class="smsvg" preserveAspectRatio="xMidYMid meet">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="smarrow"/></marker>
      <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="smarrowT"/></marker>
      <marker id="arrowI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="smarrowI"/></marker>
    </defs>${line}${box}</svg>`;
  const kindCell=e=> e.kind==="taint"
      ? `<span class="sev high" style="font-size:9px">cross-taint</span>`
      : e.kind==="ipc" ? `<span class="st corroborated" style="font-size:9px">ipc</span>`
      : `<span class="mono" style="font-size:11px">${esc(e.kind)}</span>`;
  const symCell=e=> e.kind==="taint"
      ? esc(e.symbol||'')+`<span class="mono" style="color:var(--danger)"> ⚡ source→sink</span>`
      : e.kind==="ipc"
      ? `<span class="mono">${esc(e.detail||e.symbol||'')}</span><span class="mono" style="color:var(--info)"> ⇄ channel</span>`
      : esc((e.symbols||[]).slice(0,6).join(', '))||'—';
  const rank=e=> e.kind==="taint"?0 : e.kind==="ipc"?1 : 2;
  const ord=[...edges].sort((a,b)=>rank(a)-rank(b));
  const rows = edges.length ? `<table><thead><tr><th>Importer</th><th></th><th>Exporter</th>
      <th>Kind</th><th>Symbols</th></tr></thead><tbody>
    ${ord.map(e=>`<tr><td class="mono">${esc(name[e.src]||e.src.slice(0,8))}</td>
      <td style="color:var(--accent)">→</td>
      <td class="mono">${esc(name[e.dst]||e.dst.slice(0,8))}</td>
      <td>${kindCell(e)}</td>

const _STATEORD={candidate:0,corroborated:1,confirmed:2,"poc-backed":3};
function _stCls(s){ return s==="poc-backed"||s==="confirmed"?"on":(s==="corroborated"?"partial":"unknown"); }
async function loadFindings(tid){
  const el=document.getElementById("findings"); if(!el) return;
  const fs=await api(`/targets/${tid}/findings`)||[];
  const dstat=document.getElementById("detectstat");
  if(!fs.length){ el.innerHTML=`<div class="hint" style="margin-top:6px">No findings yet — run Detect CWEs or a fuzzer.</div>`;
    if(dstat) dstat.textContent=""; return; }
  // dedup for display: group identical (cwe,title); keep the strongest state + all sites
  const groups={};
  fs.forEach(f=>{ const k=(f.cwe||'')+"|"+(f.title||'');
    const g=groups[k]||(groups[k]={cwe:f.cwe,title:f.title,severity:f.severity,state:f.state,n:0,ids:[]});
    g.n++; g.ids.push(f.id);
    if((_STATEORD[f.state]||0)>(_STATEORD[g.state]||0)) g.state=f.state; });
  const arr=Object.values(groups).sort((a,b)=>(_SEVRANK[b.severity]||0)-(_SEVRANK[a.severity]||0));
  if(dstat) dstat.textContent = `${arr.length} finding${arr.length!==1?'s':''}`+(arr.length!==fs.length?` · ${fs.length} sites`:"");
  el.innerHTML=`<div class="eyebrow" style="margin:6px 0">Findings (${arr.length}${arr.length!==fs.length?` · ${fs.length} sites`:""})</div>`+
    `<div class="sec" style="max-height:190px;overflow:auto">`+
    arr.map(g=>`<div class="frow clk" onclick="openBoardFinding('${g.ids[0]}')" title="Open in the Findings Board">`+
      `<span style="color:${SEVCOL[g.severity]||'var(--faint)'}">${esc(g.cwe||'')}</span> `+
      `<span class="mit ${_stCls(g.state)}" style="text-transform:uppercase">${esc(g.state)}</span> `+
      `${esc(g.title||'')}${g.n>1?`<span class="fcount">×${g.n} sites</span>`:''}</div>`).join("")+
    `</div>`;
}

function renderStrings(q){
  const el=document.getElementById("strings"); if(!el) return;
  if(!STRINGS.length){ el.innerHTML=`<div class="hint">No strings yet — run Decompile.</div>`; return; }
  q=(q||"").toLowerCase();
  const list = q ? STRINGS.filter(s=>(s.value||"").toLowerCase().includes(q)) : STRINGS;
  const cap=2000, shown=list.slice(0,cap);
  el.innerHTML = `<input class="fsearch" placeholder="filter strings…" value="${esc(q)}" oninput="renderStrings(this.value)">`+
    `<div class="mono" style="color:var(--faint);font-size:10px;margin-bottom:3px">${list.length===STRINGS.length?STRINGS.length:list.length+" of "+STRINGS.length} strings</div>`+
    `<div class="sec" style="max-height:240px;overflow:auto">`+
    (shown.length?shown.map(s=>`${s.addr}  ${esc((s.value||"").slice(0,90))} <span style="color:var(--faint)">[${(s.xrefs||[]).length} xref]</span>`).join("<br>"):`<div class="hint">no match</div>`)+
    (list.length>cap?`<br><span class="hint">…${list.length-cap} more — refine the filter</span>`:"")+
    `</div>`;
  const inp=el.querySelector(".fsearch"); if(q&&inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
}
async function doDecompile(tid){
  const st=document.getElementById("decostat"); if(st) st.textContent="queued (Ghidra headless is slow)…";
  await fetch("/runs",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({case_id:CUR,target_id:tid,stage:"disassemble"})});
}
let FUNCS=[];
async function loadFunctions(tid){
  FUNCS = await api(`/targets/${tid}/functions`)||[];
  CVFUNC=null; const cv=document.getElementById("codeviewer"); if(cv){ cv.hidden=true; cv.innerHTML=""; }
  const ds=document.getElementById("decostat"); if(ds) ds.textContent = FUNCS.length?`${FUNCS.length} functions`:"";
  renderFuncs("");
}
function renderFuncs(q){
  const el=document.getElementById("funcs"); if(!el) return;
  if(!FUNCS.length){ el.innerHTML=`<div class="hint" style="margin-top:6px">No functions yet — run Decompile.</div>`; return; }
  q=(q||"").toLowerCase();
  const list = q ? FUNCS.filter(f=>((f.name||"")+" "+f.addr).toLowerCase().includes(q)) : FUNCS;
  const cap=600, shown=list.slice(0,cap);
  el.innerHTML = `<div class="eyebrow" style="margin:6px 0">Functions (${FUNCS.length})</div>`+
    `<input class="fsearch" placeholder="filter functions by name or address…" value="${esc(q)}" oninput="renderFuncs(this.value)">`+
    `<div class="sec" style="max-height:200px;overflow:auto">`+
    (shown.length?shown.map(f=>`<div class="frow clk" data-id="${f.id}">${f.addr}  ${esc(f.name||"")} <span style="color:var(--faint)">(${f.size||0})</span></div>`).join(""):`<div class="hint">no match</div>`)+
    (list.length>cap?`<div class="hint">…${list.length-cap} more — refine the filter</div>`:"")+
    `</div>`;
  el.querySelectorAll(".frow[data-id]").forEach(d=> d.onclick=()=>showFunc(d.dataset.id));
  const s=el.querySelector(".fsearch"); if(q&&s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length); }
}
let CVFUNC=null;
async function showFunc(fid){
  CVFUNC = await api(`/functions/${fid}`);
  renderCodeViewer();
  document.querySelectorAll("#funcs .frow").forEach(r=>r.classList.toggle("on", r.dataset.id===fid));
  const cv=document.getElementById("codeviewer"); if(cv) cv.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function renderCodeViewer(){
  const el=document.getElementById("codeviewer"); if(!el||!CVFUNC) return;
  const f=CVFUNC; el.hidden=false;
  const blocks=(f.ir&&f.ir.blocks)?f.ir.blocks:[];
  const callees=f.callees||[];
  const calls = callees.length
    ? callees.map(c=>`<span class="${c.external?'ext':''}">${esc(c.dst_name||c.dst_addr)}</span>`).join("")
    : `<span class="hint">no calls</span>`;
  el.innerHTML=`<div class="cvhead">
      <div class="cvname"><b>${esc(f.name||("sub_"+f.addr))}</b>
        <span class="mono" style="color:var(--faint)">${f.addr} · ${f.blocks||blocks.length} blk · ${f.edges||0} edges</span></div></div>
    <div class="cvbody">
      <div class="cvpane"><div class="cvplabel">CFG (${blocks.length} blocks · ${f.edges||0} edges)</div>
        <div class="cvcfg">${renderCFGGraph(blocks)}</div></div>
      <div class="cvpane"><div class="cvplabel">Pseudocode</div>
        <pre class="cvcode">${esc(f.decompiled||"(no decompilation — run Decompile)")}</pre></div>
    </div>
    <div class="cvcalls"><span class="cvplabel" style="padding:0;margin-right:2px">Calls</span>${calls}</div>`;
}
// Vanilla layered SVG CFG: rank blocks by BFS depth, box per basic block with its
// disassembly, real arrowed edges, back-edges (loops) drawn dashed. No external libs (air-gap).
function renderCFGGraph(blocks){
  if(!blocks || !blocks.length) return `<div class="hint" style="padding:10px 12px">no CFG — run Decompile</div>`;
  const byAddr={}; blocks.forEach(b=>byAddr[b.addr]=b);
  const rank={}, q=[blocks[0].addr]; rank[blocks[0].addr]=0;   // BFS ranks from the entry block
  while(q.length){ const a=q.shift(), b=byAddr[a]; if(!b) continue;
    (b.succ||[]).forEach(s=>{ if(byAddr[s] && rank[s]===undefined){ rank[s]=rank[a]+1; q.push(s); } }); }
  let maxr=0; Object.values(rank).forEach(r=>maxr=Math.max(maxr,r));
  blocks.forEach(b=>{ if(rank[b.addr]===undefined) rank[b.addr]=++maxr; });   // unreachable -> tail
  const rows={}; blocks.forEach(b=>{ (rows[rank[b.addr]]=rows[rank[b.addr]]||[]).push(b); });
  const ranks=Object.keys(rows).map(Number).sort((a,b)=>a-b);
  const boxW=176, lineH=12, headH=15, pad=6, maxLines=7, gapX=28, gapY=32;
  const nins=b=>(b.instructions||[]).length;
  const boxH=b=>headH+pad+Math.min(nins(b),maxLines)*lineH+(nins(b)>maxLines?lineH:0)+pad;
  const pos={}; let y=12, maxW=boxW;
  ranks.forEach(r=>{ const row=rows[r]; maxW=Math.max(maxW,row.length*(boxW+gapX)-gapX);
    let hmax=0; row.forEach(b=>hmax=Math.max(hmax,boxH(b)));
    row.forEach((b,i)=>pos[b.addr]={x:i*(boxW+gapX),y:y,w:boxW,h:boxH(b)}); y+=hmax+gapY; });
  const W=maxW+24, H=y;
  ranks.forEach(r=>{ const row=rows[r], rowW=row.length*(boxW+gapX)-gapX, off=(W-24-rowW)/2+12;
    row.forEach(b=>pos[b.addr].x+=off); });
  const edges=[]; blocks.forEach(b=>(b.succ||[]).forEach(s=>{ const sp=pos[b.addr], dp=pos[s]; if(!dp) return;
    const x1=sp.x+sp.w/2, y1=sp.y+sp.h, x2=dp.x+dp.w/2, y2=dp.y, back=rank[s]<=rank[b.addr];
    if(back){ const mx=Math.max(sp.x+sp.w,dp.x+dp.w)+34;
      edges.push(`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" class="cfgedge back" marker-end="url(#cfgar)"/>`); }
    else edges.push(`<path d="M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}" class="cfgedge" marker-end="url(#cfgar)"/>`);
  }));
  const boxes=blocks.map(b=>{ const p=pos[b.addr];
    const ins=(b.instructions||[]).slice(0,maxLines).map((i,j)=>
      `<text x="${p.x+pad}" y="${p.y+headH+lineH*(j+1)}" class="cfgins">${esc((i.text||'').slice(0,28))}</text>`).join('');
    const more=nins(b)>maxLines?`<text x="${p.x+pad}" y="${p.y+headH+lineH*(maxLines+1)}" class="cfgins dim">…${nins(b)-maxLines} more</text>`:'';
    return `<g class="cfgnode"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="6"/>`+
      `<text x="${p.x+pad}" y="${p.y+11}" class="cfghdr">${esc(b.addr)}</text>${ins}${more}</g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="cfgsvg">`+
    `<defs><marker id="cfgar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="cfgarh"/></marker></defs>`+
    edges.join('')+boxes+`</svg>`;
}
function renderCFG(blocks){
  return blocks.map(b=>{
    const succ = (b.succ&&b.succ.length) ? "   -> "+b.succ.join(", ") : "";
    const insns = (b.instructions||[]).map(i=>{
      const pc = (i.pcode||[]).map(p=>"          "+p).join("\n");
      return "  "+i.addr+"  "+esc(i.text)+(pc?"\n"+pc:"");
    }).join("\n");
    return `[block ${b.addr}]${succ}\n${insns}`;
  }).join("\n\n");
}

// ---- events ----
function openWS(id){
  if(WS){ try{WS.close();}catch(e){} }
  document.getElementById("log").innerHTML="";
  WS = new WebSocket(`ws://${location.host}/events?case_id=${id}`);
  WS.onmessage = ev=>{
    let e; try{e=JSON.parse(ev.data);}catch(_){return;}
    logline(e.type, e.run_id?e.run_id.slice(0,8):"", e.payload, e.ts);
    if(["job.done","job.error","triage.done","job.cachehit","job.started"].includes(e.type)) refresh();
    if(e.type==="re.done" && DETAIL_TID){
      loadFunctions(DETAIL_TID);
      const ds=document.getElementById("decostat"); if(ds) ds.textContent="done: "+((e.payload&&e.payload.functions)||0)+" functions";
    }
    if(e.type==="findings.done" && DETAIL_TID){ loadFindings(DETAIL_TID); }
    if(e.type==="dynamic.done" && DETAIL_TID){ loadDyn(DETAIL_TID); loadFindings(DETAIL_TID); }
    if(e.type==="fuzz.progress"){ const st=document.getElementById("fuzzstat"); if(st&&e.payload) st.textContent=`${e.payload.execs} execs · ${e.payload.crashes} crashes`; }
    if(e.type==="coverage.harvest"){ const st=document.getElementById("fuzzstat"); if(st&&e.payload) st.textContent=`AFL++: ${e.payload.crash_inputs} crash inputs`; }
    if(e.type==="directed.start"){ const st=document.getElementById("fuzzstat"); if(st&&e.payload) st.textContent = e.payload.directed ? `directed → ${e.payload.top_target} (${e.payload.dictionary} toks)` : "directed: no static targets"; }
    if(e.type==="concolic.start"){ const st=document.getElementById("fuzzstat"); if(st&&e.payload) st.textContent=`concolic → ${e.payload.targets.length} target(s), ${e.payload.seeds} seeds`; }
    if(e.type==="concolic.explored"){ const st=document.getElementById("fuzzstat"); if(st&&e.payload) st.textContent=`concolic reached ${e.payload.reached.length}, ${e.payload.generated} inputs`; }
    if(e.type==="concolic.done" && DETAIL_TID){
      const st=document.getElementById("fuzzstat"); if(st&&e.payload) st.textContent=`concolic done: ${e.payload.confirmed} crashes · ${e.payload.corroborated} corroborated · ${e.payload.new_seeds} seeds`;
      loadDyn(DETAIL_TID); loadFindings(DETAIL_TID);
    }
    if(e.type==="directed.done" && DETAIL_TID){
      const st=document.getElementById("fuzzstat"); if(st&&e.payload) st.textContent=`directed done: ${e.payload.execs} execs · ${e.payload.unique} unique`;
      loadDyn(DETAIL_TID); loadFindings(DETAIL_TID);
    }
    if(e.type==="coverage.done" && DETAIL_TID){
      const st=document.getElementById("fuzzstat"); if(st&&e.payload) st.textContent=`AFL++ done: ${e.payload.confirmed} confirmed · ${e.payload.unique} unique`;
      loadDyn(DETAIL_TID); loadFindings(DETAIL_TID);
    }
    if(e.type==="fuzz.done" && DETAIL_TID){
      const st=document.getElementById("fuzzstat"); if(st&&e.payload) st.textContent=`done: ${e.payload.execs} execs · ${e.payload.unique} unique`;
      loadDyn(DETAIL_TID); loadFindings(DETAIL_TID);
    }
    if(e.type==="firmware_rehost.done"){
      const st=document.getElementById("decostat");
      if(st&&e.payload) st.textContent = e.payload.supported===false ? ("rehost: "+(e.payload.note||"unsupported"))
        : `rehosted: ${e.payload.coverage||0} blocks`+(e.payload.crash?` · CRASH ${e.payload.cwe||''}`:` · ${e.payload.iters||0} iters`);
      if(DETAIL_TID) loadFindings(DETAIL_TID);
    }
    if(e.type==="firmware.done"){
      const st=document.getElementById("decostat");
      if(st&&e.payload) st.textContent = `carved ${e.payload.components} component(s), ${e.payload.signatures} signature(s)`
        + (e.payload.arch?` · ${e.payload.arch} @ ${e.payload.base_addr?('0x'+Number(e.payload.base_addr).toString(16)):'?'}`:'')
        + (e.payload.keys?` · ${e.payload.keys} key(s)`:'');
      refresh(); if(DETAIL_TID) loadFindings(DETAIL_TID);
    }
    if(e.type==="multidebug.done" && DETAIL_TID){
      const st=document.getElementById("fuzzstat");
      if(st&&e.payload) st.textContent = e.payload.supported===false ? ("multi-debug: "+(e.payload.note||"unsupported"))
        : (e.payload.blame ? ("multi-debug: "+e.payload.blame).slice(0,100) : (e.payload.note||"no fault"));
      loadFindings(DETAIL_TID);
    }
    if(e.type==="rootcause.done" && DETAIL_TID){
      const st=document.getElementById("fuzzstat");
      if(st&&e.payload) st.textContent = e.payload.summary ? ("root cause: "+e.payload.summary).slice(0,90) : (e.payload.note||"no fault reproduced");
      loadFindings(DETAIL_TID);
    }
    if(e.type==="exploit.done" && DETAIL_TID){
      const st=document.getElementById("fuzzstat");
      if(st&&e.payload){ st.textContent = e.payload.supported===false ? ("L3: "+(e.payload.note||"unsupported"))
        : (e.payload.confirmed ? `L3 CONFIRMED: ret2win → ${esc(e.payload.win||'')} @ offset ${e.payload.offset}`
           : `L3: ${esc(e.payload.win||'win')} not reached (${esc(e.payload.note||'')})`.slice(0,110)); }
      loadPocs(DETAIL_TID); loadFindings(DETAIL_TID);
    }
    if(e.type==="primitive.done" && DETAIL_TID){
      const st=document.getElementById("fuzzstat");
      if(st&&e.payload){ st.textContent = e.payload.confirmed
        ? `L2 CONFIRMED: ${e.payload.primitive} @ offset ${e.payload.offset}`
        : (e.payload.primitive ? `L2: ${e.payload.primitive} (unconfirmed)` : (e.payload.note||"no L2 primitive")); }
      loadPocs(DETAIL_TID); loadFindings(DETAIL_TID);
    }
    if(e.type==="harness.start"){ const st=document.getElementById("fuzzstat"); if(st&&e.payload) st.textContent = e.payload.error?("boundary: "+e.payload.error):`boundary → ${esc(e.payload.family)} ${esc(e.payload.key)}`; }
    if(e.type==="harness.progress"){ const st=document.getElementById("fuzzstat"); if(st&&e.payload) st.textContent=`boundary: ${e.payload.execs} execs · ${e.payload.crashes} crashes`; }
    if(e.type==="harness.done" && DETAIL_TID){ const st=document.getElementById("fuzzstat"); if(st&&e.payload) st.textContent = e.payload.error?("boundary: "+e.payload.error):`boundary done: ${e.payload.execs} execs · ${e.payload.unique} unique`; loadDyn(DETAIL_TID); loadFindings(DETAIL_TID); }
    if(e.type==="poc.done" && DETAIL_TID){ loadPocs(DETAIL_TID); loadFindings(DETAIL_TID); }
    if((e.type==="cross_taint.done"||e.type==="link.done"||e.type==="ipc_model.done"||e.type==="system.done") && BOARD_VIEW==="sysmap"){ loadSystemMap(false); }
    if(e.type==="cross_taint.done" && e.payload){ logline("xtaint","",`${e.payload.cross_findings} cross-component finding(s)`); }
    if(e.type==="ipc_model.done" && e.payload){ logline("ipc","",`${e.payload.ipc_edges} channel edge(s), ${e.payload.cross_findings} candidate(s)`); }
    if(e.type==="system.start" && e.payload){ logline("detonate","",e.payload.error?("system: "+e.payload.error):`entry ${esc(e.payload.entry||'')} → ${(e.payload.services||[]).join(', ')}`); }
    if(e.type==="system.progress" && e.payload){ logline("detonate","",`${e.payload.execs} detonations · ${e.payload.cross_boundary} cross-boundary`); }
    if(e.type==="system.done" && e.payload){ logline("detonate","",e.payload.error?("system: "+e.payload.error):`done: ${e.payload.cross_boundary||e.payload.crashes||0} cross-boundary crash(es)`); }
  };
  WS.onclose = ()=> logline("ws","","disconnected");
}
function fmtClock(ts){
  const d = ts ? new Date(ts*1000) : new Date();
  return d.toTimeString().slice(0,8);   // HH:MM:SS (local)
}
function fmtAgo(ts){
  if(!ts) return "";
  const s=Math.max(0,Math.floor(Date.now()/1000-ts));
  if(s<60) return s+"s ago"; if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago";
}
function logline(type, run="", payload="", ts){
  const el=document.getElementById("log"); if(!el) return;
  const p = payload && typeof payload==="object" ? JSON.stringify(payload) : (payload||"");
  const d=document.createElement("div"); d.className="logline";
  d.innerHTML = `<span class="lt">${fmtClock(ts)}</span> <span class="t">${esc(type)}</span> ${run?`<span style="color:var(--faint)">${run}</span> `:""}${esc(p)}`;
  el.appendChild(d); el.scrollTop=el.scrollHeight;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

// ---- case import (rail) ----
document.getElementById("impcase").onclick=()=>document.getElementById("impfilerail").click();
document.getElementById("impfilerail").onchange=(e)=>doImportCase(e.target.files[0]);

// ---- command palette + keyboard-first nav ----
function dl(url){ const a=document.createElement("a"); a.href=url; a.download=""; document.body.appendChild(a); a.click(); a.remove(); }
function ACTIONS(){ return [
  {label:"New case", run:()=>document.getElementById("newcase").click()},
  {label:"Import case archive…", run:()=>document.getElementById("impfilerail").click()},
  ...(CUR?[
    {label:"Open Workbench", hint:"1", run:()=>switchView("wb")},
    {label:"Open Findings Board", hint:"2", run:()=>switchView("board")},
    {label:"Open System Map", hint:"3", run:()=>switchView("sysmap")},
    {label:"Open Report builder", hint:"4", run:()=>switchView("report")},
    {label:"Resolve component links", run:()=>{switchView("sysmap");loadSystemMap(true);}},
    {label:"Analyze cross-binary taint", run:()=>{switchView("sysmap");doCrossTaint();}},
    {label:"Model IPC channels", run:()=>{switchView("sysmap");doModelIpc();}},
    {label:"Detonate whole system", run:()=>{switchView("sysmap");doWholeSystem();}},
    {label:"Open HTML report ↗", run:()=>window.open(reportURL("html",true),"_blank")},
    {label:"Download PDF report", run:()=>dl(reportURL("pdf",true))},
    {label:"Download SARIF export", run:()=>dl(reportURL("sarif",true))},
    {label:"Download case JSON", run:()=>dl(reportURL("json",true))},
    {label:"Export case (.tar.gz)", run:()=>dl(`/cases/${CUR}/export`)},
    {label:"Refresh case", run:()=>refresh()},
  ]:[]),
  {label:"Toggle theme", run:()=>document.getElementById("theme").click()},
];}
let PAL_SEL=0, PAL_ITEMS=[];
function openPalette(){
  const p=document.getElementById("palette"); p.hidden=false;
  const q=document.getElementById("palq"); q.value=""; PAL_SEL=0; renderPalette(""); q.focus();
}
function closePalette(){ document.getElementById("palette").hidden=true; }
function renderPalette(term){
  const all=ACTIONS(); term=(term||"").toLowerCase();
  PAL_ITEMS=all.filter(a=>a.label.toLowerCase().includes(term));
  if(PAL_SEL>=PAL_ITEMS.length) PAL_SEL=Math.max(0,PAL_ITEMS.length-1);
  const list=document.getElementById("pallist");
  list.innerHTML = PAL_ITEMS.length ? PAL_ITEMS.map((a,i)=>`<div class="palitem ${i===PAL_SEL?'sel':''}" data-i="${i}">
    <span>${esc(a.label)}</span>${a.hint?`<span class="hint">${esc(a.hint)}</span>`:''}</div>`).join('')
    : `<div class="palitem">No matching command</div>`;
  list.querySelectorAll(".palitem[data-i]").forEach(el=>{
    el.onclick=()=>{ const a=PAL_ITEMS[+el.dataset.i]; closePalette(); if(a) a.run(); };
  });
}
document.getElementById("cmdk").onclick=openPalette;
document.getElementById("palq").oninput=(e)=>{ PAL_SEL=0; renderPalette(e.target.value); };
document.getElementById("palette").addEventListener("click",(e)=>{ if(e.target.id==="palette") closePalette(); });
document.addEventListener("keydown",(e)=>{
  const pal=document.getElementById("palette");
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); pal.hidden?openPalette():closePalette(); return; }
  if(!pal.hidden){
    const q=document.getElementById("palq").value;
    if(e.key==="Escape") closePalette();
    else if(e.key==="ArrowDown"){ e.preventDefault(); PAL_SEL=Math.min(PAL_SEL+1,PAL_ITEMS.length-1); renderPalette(q); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); PAL_SEL=Math.max(PAL_SEL-1,0); renderPalette(q); }
    else if(e.key==="Enter"){ e.preventDefault(); const a=PAL_ITEMS[PAL_SEL]; closePalette(); if(a) a.run(); }
    return;
  }
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||"")) return;
  if(CUR){
    if(e.key==="1") switchView("wb");
    else if(e.key==="2") switchView("board");
    else if(e.key==="3") switchView("sysmap");
    else if(e.key==="4") switchView("report");
    else if(e.key==="/" && BOARD_VIEW==="board"){ e.preventDefault(); const q=document.getElementById("bq"); if(q) q.focus(); }
  }
});

loadCases();
