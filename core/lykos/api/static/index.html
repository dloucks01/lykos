<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lykos workbench</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c2230; --line: #2b3444;
    --ink: #e6edf3; --muted: #8b98a9; --faint: #5b6675;
    --accent: #4c8dff; --accent-2: #7aa2ff;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --run: #58a6ff;
    --crit: #ff6b6b; --high: #ff8f4c; --med: #d9a441; --low: #6cc79a; --info: #7d8aa0;
    --radius: 10px; --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  /* Light theme -- opt in via the header toggle (persisted), or the OS preference when the
     viewer has not chosen. GitHub-light-inspired, mirroring the GitHub-dark default above. */
  :root[data-theme="light"] {
    --bg: #ffffff; --panel: #f6f8fa; --panel-2: #eef1f5; --line: #d0d7de;
    --ink: #1f2328; --muted: #656d76; --faint: #8c959f;
    --accent: #0969da; --accent-2: #0550ae;
    --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --run: #0969da;
    --crit: #cf222e; --high: #bc4c00; --med: #9a6700; --low: #1a7f37; --info: #6e7781;
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #ffffff; --panel: #f6f8fa; --panel-2: #eef1f5; --line: #d0d7de;
      --ink: #1f2328; --muted: #656d76; --faint: #8c959f;
      --accent: #0969da; --accent-2: #0550ae;
      --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --run: #0969da;
      --crit: #cf222e; --high: #bc4c00; --med: #9a6700; --low: #1a7f37; --info: #6e7781;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { line-height: 1.5; }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h2 { font-size: 1.05rem; margin: 0; letter-spacing: .2px; }

  .app { max-width: 940px; margin: 0 auto; padding: 0 20px 80px; }
  .topbar { display: flex; align-items: center; justify-content: space-between;
    padding: 18px 2px; border-bottom: 1px solid var(--line); margin-bottom: 22px; position: sticky;
    top: 0; background: var(--bg); z-index: 5; }
  .brand { font-weight: 650; font-size: 1.15rem; letter-spacing: .3px; }
  .brand .logo { color: var(--accent); margin-right: 4px; }
  .brand .tag { color: var(--faint); font-weight: 400; font-size: .8rem; margin-left: 4px; }
  .top-right { display: flex; align-items: center; gap: 10px; }
  .hz { font-size: .74rem; padding: 3px 8px; border-radius: 20px; border: 1px solid var(--line); color: var(--muted); }
  .hz-ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .hz-bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }

  .stack { display: flex; flex-direction: column; gap: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .banner { padding: 10px 14px; border-radius: 8px; font-size: .9rem; }
  .banner.err { background: color-mix(in srgb, var(--bad) 15%, var(--panel)); border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent); color: #ffd7d3; }
  .center { text-align: center; padding: 14px; color: var(--muted); }

  /* Drop zone */
  .dropzone { display: block; border: 2px dashed var(--line); border-radius: 14px; padding: 54px 20px;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s; background: var(--panel); }
  .dropzone:hover { border-color: var(--accent); background: var(--panel-2); }
  .dropzone.busy { opacity: .6; pointer-events: none; }
  .dz-icon { font-size: 2.4rem; color: var(--accent); }
  .dz-title { font-size: 1.15rem; font-weight: 600; margin-top: 8px; }
  .dz-sub { color: var(--muted); font-size: .9rem; margin-top: 4px; }

  /* Target summary + CTA */
  .run-panel { display: flex; flex-direction: column; gap: 16px; }
  .summary .sum-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sum-name { font-weight: 650; font-size: 1.05rem; word-break: break-all; }
  .sum-ix { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
    border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); font-size: .74rem;
    color: var(--accent-2); margin-right: 8px; vertical-align: middle; }
  .dropzone.compact { padding: 20px; border-width: 1px; }
  .dropzone.compact .dz-icon { font-size: 1.4rem; }
  .dropzone.compact .dz-title { font-size: .95rem; }
  .sum-hash { color: var(--faint); font-family: var(--mono); font-size: .78rem; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
  .fact { display: flex; flex-direction: column; }
  .fk { font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); }
  .fv { font-size: .9rem; }
  .headline { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--accent-2); font-size: .95rem; }
  .sum-head { align-items: flex-start; }
  .mits { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 55%; }
  .mit { font-size: .68rem; padding: 2px 7px; border-radius: 5px; font-family: var(--mono); white-space: nowrap; border: 1px solid var(--line); }
  .mit-good { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .mit-weak { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .dang { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .dang-lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; color: var(--warn); margin-right: 4px; }
  .dang-sym { font-family: var(--mono); font-size: .78rem; color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: 5px; padding: 1px 6px; }
  .hashes { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; }
  .hash-row { display: flex; gap: 10px; font-size: .74rem; }
  .hash-row .hk { flex: 0 0 56px; color: var(--faint); text-transform: uppercase; letter-spacing: .5px; }
  .hash-row .hv { font-family: var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; }

  .cta { text-align: center; padding: 6px 0 2px; }
  .cta-sub { color: var(--muted); font-size: .85rem; margin-top: 8px; }
  .bg-status { margin-bottom: 8px; }
  /* Autopilot pipeline plan: done / running / remaining at a glance */
  .plan { padding: 12px 14px; margin-bottom: 12px; text-align: left; }
  .plan-head { display: flex; justify-content: space-between; align-items: center; font-size: .82rem;
    color: var(--muted); margin-bottom: 8px; }
  .plan-head .mono { color: var(--ink); font-family: var(--mono); }
  .plan-count { font-variant-numeric: tabular-nums; color: var(--accent-2); font-weight: 600; }
  .plan-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .plan-step { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 6px;
    font-size: .9rem; color: var(--faint); }
  .plan-step .plan-ico { width: 1.1em; text-align: center; flex: none; }
  .plan-step .plan-lbl { flex: 1; }
  .plan-step .plan-detail { color: var(--muted); font-size: .8rem; }
  .plan-step.step-pending { color: var(--faint); }
  .plan-step.step-running { color: var(--ink); background: color-mix(in srgb, var(--run) 12%, transparent); }
  .plan-step.step-running .plan-lbl { font-weight: 600; }
  .plan-step.step-done { color: var(--ink); }
  .plan-step.step-done .plan-ico { color: var(--ok); }
  .plan-step.step-skipped { color: var(--faint); }
  .plan-step.step-error { color: var(--bad); }
  .plan-step.step-error .plan-ico { color: var(--bad); }
  .plan-step.step-cancelled { color: var(--warn); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink); border-radius: 8px; padding: 8px 14px;
    font-size: .88rem; cursor: pointer; font-family: inherit; }
  .btn:hover { border-color: var(--accent); text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
  .btn.big { font-size: 1.05rem; padding: 12px 28px; }
  .btn.small { padding: 5px 10px; font-size: .8rem; }
  .btn.ghost { background: transparent; }
  .theme-toggle { padding: 6px 10px; font-size: 1rem; line-height: 1; }

  /* Log */
  .log-head { font-weight: 600; margin-bottom: 10px; min-height: 20px; }
  .log-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .log-row { display: flex; align-items: baseline; gap: 9px; font-size: .88rem; }
  /* stage rows: a status icon that transitions in place */
  .st-ico { flex: 0 0 16px; width: 16px; text-align: center; font-size: .8rem; font-weight: 700; line-height: 1.4; }
  .st-ok { color: var(--ok); }
  .st-bad { color: var(--bad); }
  .st-run { flex: 0 0 16px; width: 12px; height: 12px; margin: 3px 2px 0; border: 2px solid var(--line);
    border-top-color: var(--run); border-radius: 50%; animation: rot .7s linear infinite; }
  .log-row.st-running .log-label { color: var(--run); }
  .log-row.st-running { opacity: 1; }
  .log-label { font-weight: 500; }
  .log-detail { color: var(--muted); font-size: .82rem; }
  .log-detail::before { content: "— "; color: var(--faint); }
  .log-cached { color: var(--faint); font-size: .72rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .log-progress { color: var(--run); font-size: .82rem; font-variant-numeric: tabular-nums; }
  .log-progress::before { content: "— "; color: var(--faint); }
  /* info rows: a small coloured dot */
  .log-row.info .log-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; margin: 5px 4px 0; background: var(--accent); }
  .log-row.tone-warn .log-dot { background: var(--warn); }
  .log-row.info .log-text { color: var(--muted); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* Results */
  .results-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .results-head .report-links { margin-left: auto; display: flex; gap: 6px; }
  .pill { font-size: .74rem; padding: 3px 9px; border-radius: 20px; }
  .pill.good { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }

  .finding { border-left: 3px solid var(--line); }
  .finding.demo { border-left-color: var(--ok); background: color-mix(in srgb, var(--ok) 6%, var(--panel)); }
  .find-top { display: flex; align-items: flex-start; gap: 11px; }
  .find-id { flex: 1 1 auto; }
  .find-title { font-weight: 600; }
  .find-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .78rem; color: var(--muted); margin-top: 2px; }
  .find-meta .cwe { font-family: var(--mono); color: var(--accent-2); }
  .find-gloss { color: var(--muted); font-size: .82rem; margin-top: 8px; }
  .effects { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .effects-head { font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .effect-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
    font-size: .78rem; font-weight: 600; border: 1px solid transparent; }
  .effect-badge .eff-status { font-size: .62rem; letter-spacing: .05em; text-transform: uppercase; opacity: .7; font-weight: 700; }
  .eff-demo { background: color-mix(in srgb, var(--bad) 16%, transparent); border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: color-mix(in srgb, var(--bad) 88%, var(--ink)); }
  .eff-pot { background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 35%, transparent); color: color-mix(in srgb, var(--warn) 85%, var(--ink)); }
  .effect-proofs { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .effect-proofs li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .82rem; }
  .ep-k { font-weight: 600; color: color-mix(in srgb, var(--bad) 85%, var(--ink)); }
  .ep-note { color: var(--muted); }
  .btn.xsmall { font-size: .7rem; padding: 2px 8px; }
  .sev { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center;
    justify-content: center; font-size: .72rem; font-weight: 700; color: #0d1117; flex: 0 0 auto; }
  .sev-critical { background: var(--crit); } .sev-high { background: var(--high); }
  .sev-medium { background: var(--med); } .sev-low { background: var(--low); } .sev-info { background: var(--info); }
  .badge { font-size: .72rem; padding: 3px 9px; border-radius: 20px; white-space: nowrap; border: 1px solid var(--line); }
  .badge.state-poc-backed { background: var(--ok); color: #0d1117; border-color: var(--ok); font-weight: 700; }
  .badge.state-confirmed { background: color-mix(in srgb, var(--ok) 25%, transparent); color: var(--ok); }
  .badge.state-corroborated { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
  .badge.state-candidate { color: var(--muted); }

  .find-meta .at code { font-family: var(--mono); color: var(--accent-2); }
  .exploit-rating { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-top: 12px;
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); }
  .exploit-rating.exp-hi { background: color-mix(in srgb, var(--bad) 12%, transparent); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  .exploit-rating.exp-mid { background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
  .exploit-rating.exp-lo { background: var(--panel-2); }
  .er-badge { font-weight: 700; font-size: .78rem; letter-spacing: .3px; }
  .exp-hi .er-badge { color: var(--bad); } .exp-mid .er-badge { color: var(--warn); } .exp-lo .er-badge { color: var(--muted); }
  .er-why { font-size: .84rem; color: var(--ink); }
  .exploit { margin-top: 12px; background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
  .exploit-head { font-size: .74rem; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); margin-bottom: 6px; }
  .exploit-trail { margin: 0; padding-left: 18px; font-size: .85rem; display: flex; flex-direction: column; gap: 5px; }
  .exploit-trail li { line-height: 1.5; }
  .et-k { display: inline-block; font-size: .68rem; text-transform: uppercase; letter-spacing: .4px; color: var(--accent-2);
    background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 4px; padding: 0 6px; margin-right: 6px; }
  .nextsteps { margin-top: 12px; background: color-mix(in srgb, var(--accent) 7%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 8px; padding: 10px 12px; }
  .nextsteps .steps-head { font-size: .74rem; text-transform: uppercase; letter-spacing: .5px; color: var(--accent-2); margin-bottom: 4px; }
  .nextsteps ul { margin: 0; padding-left: 18px; font-size: .85rem; display: flex; flex-direction: column; gap: 4px; }
  .verify { font-size: .74rem; padding: 2px 8px; border-radius: 5px; font-weight: 600; white-space: nowrap; }
  .verify-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); }
  .verify-flaky { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
  .poc-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .poc-level { font-family: var(--mono); font-size: .76rem; color: var(--accent-2); }
  .poc-sig { font-family: var(--mono); font-size: .76rem; color: var(--warn); }
  .empty { color: var(--muted); font-size: .9rem; }

  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
    align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow: auto; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    width: 100%; max-width: 860px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .modal.code { padding: 0; }
  .code-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .code-name { font-weight: 650; font-size: 1.05rem; }
  .code-addr { font-family: var(--mono); color: var(--faint); font-size: .85rem; font-weight: 400; }
  .code-sig { display: block; margin-top: 4px; font-family: var(--mono); font-size: .8rem; color: var(--muted); }
  .frame { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .frame-lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; color: var(--warn); margin-right: 4px; }
  .frame-buf { font-family: var(--mono); font-size: .78rem; color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: 5px; padding: 1px 6px; }
  .code-body { padding: 14px 18px; }
  .code-note { color: var(--muted); font-size: .8rem; margin-bottom: 8px; }
  .code-pre { margin: 0; font-family: var(--mono); font-size: .8rem; line-height: 1.55; overflow-x: auto;
    background: var(--panel-2); border-radius: 8px; padding: 12px; max-height: 52vh; overflow-y: auto; white-space: pre; }
  .code-pre.asm { white-space: normal; }
  .code-pre.src { color: #cfe3ff; }
  .src-badge { font-size: .66rem; font-weight: 600; color: var(--accent-2); background: color-mix(in srgb, var(--accent) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 5px; padding: 1px 6px; vertical-align: middle; }
  .asm-line { white-space: pre; padding: 0 4px; border-radius: 3px; }
  .asm-a { color: var(--faint); display: inline-block; min-width: 84px; }
  .asm-hit { background: color-mix(in srgb, var(--bad) 22%, transparent); }
  .asm-tag { color: var(--bad); font-weight: 700; }
  .xrefs { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .xref { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
  .xref-k { font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); flex: 0 0 70px; }
  .xref-n { font-family: var(--mono); font-size: .78rem; color: var(--accent-2); background: var(--panel-2); border-radius: 5px; padding: 1px 6px; }
  button.xref-n.nav { border: 1px solid var(--line); cursor: pointer; }
  button.xref-n.nav:hover { border-color: var(--accent); color: #fff; background: var(--accent); }
  .xref-hint { color: var(--faint); font-size: .74rem; margin-top: 8px; }
  .code-crumbs { margin-top: 6px; font-family: var(--mono); font-size: .74rem; color: var(--muted); }
  .code-crumbs .cb { color: var(--accent-2); }
  .code-crumbs .cb-sep { color: var(--faint); margin: 0 5px; }
  .xrefs.xbin { border-top: none; padding-top: 0; }
  .xbin-k { color: var(--accent-2); }
  button.xbin-n { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  button.xbin-n:hover { background: var(--accent-2); color: #fff; }

  .unavail { border: 1px dashed var(--line); background: transparent; }
  .unavail-head { font-weight: 600; font-size: .9rem; }
  .unavail-sub { color: var(--muted); font-size: .82rem; margin: 2px 0 10px; }
  .unavail-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .unavail-list li { display: flex; gap: 12px; font-size: .84rem; align-items: baseline; }
  .unavail-name { flex: 0 0 130px; color: var(--faint); }
  .unavail-why { color: var(--muted); }

  .recent { margin-top: 16px; }
  .recent-head { font-size: .74rem; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); margin-bottom: 8px; }
  .recent-row { display: flex; width: 100%; align-items: baseline; justify-content: space-between;
