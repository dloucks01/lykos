<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lykos · PoC workbench (rebuild)</title>
<script type="importmap">
{ "imports": {
  "preact": "./vendor/preact.module.js",
  "preact/hooks": "./vendor/hooks.module.js",
  "htm": "./vendor/htm.module.js"
} }
</script>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0d12; --panel:#101319; --panel2:#141821; --card:#171b24; --code:#0a0c11;
    --fg:#e7eaf0; --mut:#8b93a3; --dim:#5a6271; --line:#222836; --line2:#2d3545;
    --acc:#2dd4bf; --acc-dim:#135e57; --acc-bg:#0b2522; --acc-fg:#5eead4;
    --green:#3fb950; --blue:#58a6ff; --amber:#e3a13a;
    --crit:#f85149; --high:#ff8e3c; --med:#e3c13a;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13.5px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
         -webkit-font-smoothing:antialiased; }
  .mono,pre,.hex,.term { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  .muted { color:var(--mut); } b { font-weight:650; } .pane-pad { padding:22px; }
  ::selection { background:#14453f; }
  /* ---- shell ---- */
  .wb { display:flex; flex-direction:column; height:100vh; }
  .top { display:flex; gap:10px; align-items:center; padding:8px 14px;
         background:var(--panel); border-bottom:1px solid var(--line); }
  .brand { font-weight:700; letter-spacing:.3px; color:var(--acc); font-size:15px; }
  .sel { background:var(--card); color:var(--fg); border:1px solid var(--line2); border-radius:7px;
         padding:5px 9px; font-size:12.5px; }
  .spacer { flex:1; }
  .tabs { display:flex; background:var(--card); border:1px solid var(--line2); border-radius:8px; padding:2px; }
  .tab { background:none; border:none; color:var(--mut); padding:4px 14px; border-radius:6px;
         font-size:12.5px; cursor:pointer; }
  .tab.on { background:var(--acc); color:#042420; font-weight:600; } .tab:disabled { opacity:.4; cursor:default; }
  .err { background:#2a1215; color:#ff9b9b; padding:8px 14px; font-size:12.5px; }
  .body { flex:1; display:grid; grid-template-columns:minmax(330px,34%) 1fr; min-height:0; }
  /* ---- findings list ---- */
  .list { display:flex; flex-direction:column; border-right:1px solid var(--line); min-height:0; background:var(--panel); }
  .filters { display:flex; gap:5px; padding:9px 12px 7px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .fb { background:var(--card); border:1px solid var(--line2); color:var(--mut); font-size:11.5px;
        padding:3px 10px; border-radius:20px; cursor:pointer; }
  .fb.on { background:var(--acc-bg); border-color:var(--acc-dim); color:var(--acc-fg); }
  .list-sum { padding:7px 14px; font-size:11.5px; color:var(--mut); border-bottom:1px solid var(--line); }
  .rows { overflow:auto; flex:1; }
  .row { display:flex; align-items:center; gap:11px; padding:10px 13px 10px 14px;
         border-bottom:1px solid var(--line); cursor:pointer; border-left:3px solid transparent; }
  .row:hover { background:var(--panel2); }
  .row.sev-critical { border-left-color:var(--crit); } .row.sev-high { border-left-color:var(--high); }
  .row.sev-medium { border-left-color:var(--med); } .row.sev-low,.row.sev-info { border-left-color:var(--dim); }
  .row.sel { background:var(--acc-bg); border-left-color:var(--acc) !important; }
  .row-l { flex:1; min-width:0; }
  .row-title { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-sub { display:flex; gap:6px; align-items:center; margin-top:3px; font-size:11px; }
  .row-cwe { color:var(--acc-fg); font-weight:600; white-space:nowrap; }
  .row-sep { color:var(--dim); }
  .row-state { color:var(--mut); }
  .row-state.st-poc-backed { color:var(--green); } .row-state.st-confirmed { color:var(--blue); }
  .row-state.st-corroborated { color:var(--amber); } .row-state.st-candidate { color:var(--dim); }
  .pbadge { flex:none; font-weight:700; font-size:12px; padding:3px 8px; border-radius:7px;
            min-width:32px; text-align:center; }
  .pbadge.det { background:#0f2e18; color:var(--green); } .pbadge.con { background:#10233c; color:var(--blue); }
  .pbadge.none { color:var(--dim); background:none; font-weight:400; }
  /* ---- right pane ---- */
  .pane { overflow:auto; background:var(--bg); }
  .sect { margin-top:20px; }
  .sect-h { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim);
            margin-bottom:9px; padding-bottom:5px; border-bottom:1px solid var(--line); font-weight:650; }
  .sect-h.mt { margin-top:22px; }
  /* ---- binary overview ---- */
  .overview { padding:22px 26px; max-width:960px; }
  .ov-head { margin-bottom:18px; }
  .ov-title { font-size:22px; font-weight:700; letter-spacing:-.2px; }
  .ov-sub { color:var(--mut); font-size:12.5px; margin-top:3px; font-family:ui-monospace,monospace; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:13px 15px; }
  .card-h { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--acc);
            margin-bottom:9px; font-weight:650; }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:3px 0; font-size:12.5px; border-top:1px solid #1b212c; }
  .kv:first-of-type { border-top:none; }
  .kv .k { color:var(--mut); white-space:nowrap; } .kv .vv { text-align:right; word-break:break-all; }
  .kv .vv.mono { font-size:11px; color:#b9c0cc; }
  .posture { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:9px; }
  .pm { background:var(--card); border:1px solid var(--line); border-radius:9px; padding:10px 12px; }
  .pm-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .pm-l { font-weight:600; font-size:12.5px; } .pm-v { font-size:11px; font-family:ui-monospace,monospace; }
  .pm-d { color:var(--dim); font-size:11px; margin-top:3px; }
  .pm.off { border-color:#1f4e2c; background:#0e1a12; } .pm.off .pm-v { color:var(--green); }
  .pm.part { border-color:#4a3c1a; background:#17140c; } .pm.part .pm-v { color:var(--amber); }
  .pm.on .pm-v { color:var(--mut); }
  .headline { margin-top:20px; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--acc);
              border-radius:8px; padding:11px 14px; font-size:12.5px; color:#cfd4dd; }
  .hl-k { color:var(--acc); font-weight:650; margin-right:6px; }
  /* ---- finding detail ---- */
  .detail { padding:22px 26px; max-width:900px; }
  .d-head { display:flex; gap:9px; align-items:center; }
  .sev { font-size:10px; text-transform:uppercase; letter-spacing:.04em; font-weight:700;
         padding:2px 8px; border-radius:5px; }
  .sev.critical { background:#2a1012; color:var(--crit); } .sev.high { background:#2a1a0e; color:var(--high); }
  .sev.medium { background:#241f0c; color:var(--med); } .sev.low,.sev.info { background:var(--card); color:var(--mut); }
  .d-cwe { color:var(--acc); font-weight:650; font-size:12.5px; } .d-cwename { color:var(--mut); font-size:12.5px; }
  .d-title { font-size:19px; font-weight:650; margin:7px 0 4px; letter-spacing:-.2px; }
  .cwe-desc { color:var(--mut); font-size:12.5px; margin-bottom:4px; }
  .ladder { display:flex; align-items:center; gap:4px; margin-top:12px; flex-wrap:wrap; }
  .rung { font-size:10.5px; padding:2px 9px; border-radius:20px; border:1px solid var(--line2); color:var(--dim); }
  .rung.on { color:var(--mut); border-color:var(--acc-dim); }
  .rung.cur { background:var(--acc); color:#042420; border-color:var(--acc); font-weight:700; }
  .arr { color:var(--dim); font-size:11px; } .arr.on { color:var(--acc-dim); }
  /* PoC deliverable */
  .deliver { background:var(--panel2); border:1px solid var(--line2); border-radius:10px; padding:14px; }
  .deliver.none { border-style:dashed; border-color:var(--line2); }
  .none-h { font-weight:600; margin-bottom:4px; color:var(--mut); }
  .dl-top { display:flex; gap:9px; align-items:center; margin-bottom:12px; }
  .dl-lvl { font-weight:800; color:var(--acc); font-size:15px; }
  .pb { font-size:11px; padding:2px 9px; border-radius:20px; font-weight:600; }
  .pb.det { background:#0f2e18; color:var(--green); } .pb.con { background:#10233c; color:var(--blue); }
  .dl-sig { color:var(--mut); font-size:12px; flex:1; }
  .btn { display:inline-block; background:var(--acc); color:#fff; text-decoration:none; padding:5px 13px;
         border-radius:7px; font-size:12px; font-weight:600; } .btn.sm { padding:4px 11px; }
  .blk { margin-top:11px; } .blk:first-child { margin-top:0; }
  .blk-h { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--dim); margin-bottom:5px; font-weight:600; }
  .term { background:var(--code); border:1px solid var(--line); border-radius:7px; padding:10px 12px;
          font-size:12px; margin:0; overflow:auto; }
  .t-com { color:var(--dim); } .t-cmd { color:#dce3ee; } .t-p { color:var(--green); user-select:none; }
  .hex { background:var(--code); border:1px solid var(--line); border-radius:7px; padding:10px 12px;
         font-size:11.5px; line-height:1.5; margin:0; overflow:auto; color:#aeb6c4; white-space:pre; }
  .sound-h { font-size:12.5px; color:#cfd4dd; margin-bottom:6px; }
  .facts { margin:0; padding-left:0; list-style:none; }
  .facts li { position:relative; padding-left:18px; margin:4px 0; font-size:12.5px; color:#c4cad4; }
  .facts li::before { content:"✓"; position:absolute; left:0; color:var(--green); font-size:11px; }
  /* status / exploitability */
  .why { font-size:13px; margin-bottom:8px; }
  .promote { background:#0e1a12; border:1px solid #1f4e2c; border-radius:7px; padding:9px 12px; font-size:12.5px; color:#bfe6c8; }
  .pr-k { color:var(--green); font-weight:650; margin-right:7px; text-transform:uppercase; font-size:11px; letter-spacing:.04em; }
  .prim { background:var(--code); border:1px solid var(--line); border-radius:7px; padding:9px 12px;
          font-size:12.5px; color:var(--acc-fg); margin-bottom:10px; }
  .miw-h { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--dim); margin-bottom:5px; }
  .miw { margin:0; padding-left:0; list-style:none; }
  .miw li { position:relative; padding-left:18px; margin:5px 0; font-size:12.5px; color:#d8be82; }
  .miw li::before { content:"⚠"; position:absolute; left:0; font-size:11px; color:var(--amber); }
  /* attack flow */
  .flow { }
  .fnode { display:flex; gap:11px; align-items:flex-start; background:var(--card); border:1px solid var(--line);
           border-left:3px solid var(--line2); border-radius:8px; padding:9px 13px; }
  .fstep { flex:none; width:19px; height:19px; border-radius:50%; background:var(--panel2); color:var(--mut);
           font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .ftitle { font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  .ftext { font-size:12.5px; margin-top:1px; }
  .fn-deliver { border-left-color:var(--blue); } .fn-reach { border-left-color:var(--amber); }
  .fn-prim { border-left-color:var(--acc); }
  .fn-effect-on { border-left-color:var(--green); }
  .fn-effect-off { border-left-color:var(--dim); border-style:dashed; }
  .fedge { display:flex; gap:8px; align-items:center; padding:5px 0 5px 9px; color:var(--dim); font-size:11px; }
  .farrow { color:var(--line2); font-size:14px; }
  .fnote { margin-top:8px; font-size:11.5px; font-style:italic; }
  /* evidence trail — flowing report, no boxes */
  .ev-flow { }
  .ev-item { padding:11px 0; border-top:1px solid var(--line); }
  .ev-item:first-child { border-top:none; padding-top:2px; }
  .ev-lbl { font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--acc-fg);
            margin-bottom:5px; font-weight:650; }
  .ev-txt { font-size:12.5px; color:#c4cad4; white-space:pre-wrap; line-height:1.6; }
  /* meta footer */
  .meta { margin-top:22px; padding-top:12px; border-top:1px solid var(--line);
          display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--dim); }
  .meta b { color:var(--mut); }
  @media (max-width:860px){ .body{ grid-template-columns:1fr; } .list{ max-height:42vh; } }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./app2/main.js"></script>
</body>
</html>
