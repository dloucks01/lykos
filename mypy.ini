# Two-tier type gate (see Makefile `typecheck`).
#
# Tier 1 -- the infra core (db/, jobs/, hashing, casestore): STRICT. Every def annotated,
# untyped bodies checked. This is where types are load-bearing: row -> dataclass mapping,
# cache-key composition, and queue state transitions are all places a wrong type is a silent
# data bug rather than a crash. This tier must stay clean.
#
# Tier 2 -- the analysis stages, API, report and eval layers: errors are NOT reported. They
# pass untyped dicts between stages by design (a stage is `fn(ctx) -> Optional[dict]`), so
# annotating them would be noise, not safety. Revisit per-module as any of them grows a real
# interface worth pinning.

[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True

# ---------------------------------------------------------------- tier 1: strict
[mypy-lykos.db.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

[mypy-lykos.jobs.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

[mypy-lykos.hashing]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

[mypy-lykos.casestore]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

# ---------------------------------------------------------------- tier 2: not gated
[mypy-lykos.analyze.*]
ignore_errors = True

[mypy-lykos.api.*]
ignore_errors = True

[mypy-lykos.report.*]
ignore_errors = True

[mypy-lykos.eval.*]
ignore_errors = True

[mypy-lykos.cli]
ignore_errors = True
